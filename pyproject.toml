[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epic-hal-cli"
version = "0.0.0"
description = "Epic HAL project scaffolder for 8-bit PIC"
requires-python = ">=3.11"

[project.scripts]
epic-hal = "epic_hal:main"

[tool.setuptools]
py-modules = ["epic_hal", "epic_hal_init", "epicmanifest", "bundlegen"]
package-dir = {"" = "scripts"}
