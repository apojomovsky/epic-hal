name: ci

# Consolidated CI: replaces host-tests.yml, xc8-build.yml, sim-tests.yml,
# and bundle-gate.yml (deleted). Those four workflows had grown to ~14
# separate job definitions, several matrixed per family or per module,
# producing 26+ individual PR checks for even a one-line change. This
# file collapses that down to 2 jobs:
#
#   - host: bare runner, no Docker. Every module/HAL's cmake+ctest, in one
#     job with an internal loop (same PASS/FAIL step-summary pattern the
#     old xc8-build.yml used for MCU variants), plus the repo's
#     pre-commit checks (trailing whitespace, no em-dash, cppcheck).
#   - target: one Docker pull, then in that single job: every real XC8
#     build across all 3 families, all 3 mdb/MPLAB SIM runs, and the
#     isolated bundle-gate build. The old versions of these three were
#     separate jobs/workflows specifically to get one `container:` per
#     job; this version invokes `docker run` directly per step instead
#     of using the job-level `container:` field, which is what makes it
#     possible to mix python3-only steps (manifest resolution, script
#     emission, bundle generation, none of which the toolchain image can
#     do, see docker/ci-toolchain/Dockerfile's "no python3") with
#     xc8-cc/mdb.sh steps in the same job. Because everything now runs on
#     one runner's filesystem, the old artifact upload/download between
#     jobs is gone too: docker run bind-mounts the checkout directly.
#
# Tradeoff, deliberate: the old per-family/per-module jobs ran
# concurrently (GitHub schedules matrix jobs on separate runners); this
# collapses them into one sequential job each, trading wall-clock time
# for a much shorter PR check list. See
# docs/superpowers/plans/2026-08-06-ci-consolidation.md for the decision.

on:
  push:
    branches: [master]
  pull_request:
  # Manual flake-hunt (REPEAT=5 sim gate run, the flake-hunt job).
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # Bare runner, no Docker: every module/HAL's cmake+ctest plus lint.
  # docs-only PRs skip the build+test loop but still run lint (a
  # trailing-whitespace/em-dash violation can live in a .md file too).
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential cppcheck jq

      # Mirrors host-tests.yml's old lint job's base-ref resolution
      # exactly, so the pre-commit diff scan and the docs-only/module
      # discovery below always agree on what range they're looking at.
      - name: Determine base ref for the diff scan
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              base="$(git rev-parse HEAD~1 2>/dev/null || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)"
              ;;
          esac
          echo "ref=$base" >> "$GITHUB_OUTPUT"

      # Every module/HAL follows the fixed host-testable contract (see
      # AGENTS.md "Module anatomy"). On a pull_request, narrow to just
      # the modules actually touched plus their transitive dependents
      # (scripts/ci-discover-affected-modules.py); a push to master
      # always gets the full, unfiltered list. Docs-only PRs get an
      # empty module list, so the build+test step below is a no-op for
      # them, not an error.
      - name: Discover affected modules
        id: discover
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            modules="$(git ls-files -- '*/CMakeLists.txt' \
              | sed 's#/CMakeLists.txt$##' | sort | jq -R -s -c 'split("\n")[:-1]')"
            echo "modules=$modules" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            result="$(python3 scripts/ci-discover-affected-modules.py \
              '${{ github.event.pull_request.base.sha }}')"
            echo "modules=$(echo "$result" | jq -c '.modules')" >> "$GITHUB_OUTPUT"
            echo "docs_only=$(echo "$result" | jq -r '.docs_only')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + test every affected module (host)
        if: steps.discover.outputs.docs_only != 'true'
        run: |
          fail=0
          { echo "| Module | Result |"; echo "|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          for module in $(echo '${{ steps.discover.outputs.modules }}' | jq -r '.[]'); do
            echo "::group::${module}"
            if cmake -B "build-host/${module}" -S "${module}" \
                 && cmake --build "build-host/${module}" \
                 && ctest --test-dir "build-host/${module}" --output-on-failure; then
              echo "PASS: ${module}"
              echo "| ${module} | PASS |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "FAIL: ${module}"
              echo "| ${module} | FAIL |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"

      # Always runs, even if the loop above failed, so a build break and
      # a lint break both surface in the same run instead of the second
      # one being hidden behind the first.
      - name: Pre-commit checks (trailing whitespace, no em-dash, cppcheck)
        if: always()
        env:
          PRE_COMMIT_BASE_REF: ${{ steps.base.outputs.ref }}
        run: bash scripts/pre-commit-checks.sh

  # One Docker pull, then real XC8 builds (all 3 families), mdb/MPLAB SIM
  # runs (all 3 families), and the isolated bundle-gate build, as
  # sequential steps in this one job. docs-only PRs skip everything past
  # the pull (a prose change cannot affect a .hex or a bundle).
  target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine docs-only
        id: docs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            result="$(bash scripts/ci-docs-only-check.sh '${{ github.event.pull_request.base.sha }}')"
          else
            result="false"
          fi
          echo "docs_only=$result" >> "$GITHUB_OUTPUT"

      # This workflow no longer builds or pushes the toolchain image
      # itself: the root Makefile (`make image`, `make ci-image-push`)
      # is the only path that publishes a new tag, from installers a
      # human drops in docker/ci-toolchain/vendor/. Fails loudly, with
      # those exact instructions, if the resolved tag isn't on GHCR yet.
      - name: Resolve + pull the toolchain image
        if: steps.docs.outputs.docs_only != 'true'
        id: image
        run: |
          xc8_version="$(grep -m1 '^ARG XC8_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic16_dfp_version="$(grep -m1 '^ARG PIC16FXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic18_dfp_version="$(grep -m1 '^ARG PIC18FXXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic1216f1_dfp_version="$(grep -m1 '^ARG PIC12_16F1XXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          mplabx_version="$(grep -m1 '^ARG MPLABX_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          tag="xc8-v${xc8_version}-dfp${pic16_dfp_version}-${pic18_dfp_version}-${pic1216f1_dfp_version}-mplabx${mplabx_version}"
          image="ghcr.io/${{ github.repository_owner }}/pic8-hal-ci:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ! docker pull "$image"; then
            echo "error: no cached $image on GHCR." >&2
            echo "  1. drop the Microchip installers in docker/ci-toolchain/vendor/" >&2
            echo "     (see 'make check-vendor' for exact filenames)" >&2
            echo "  2. docker login ghcr.io -u <you> (needs a PAT with write:packages)" >&2
            echo "  3. make ci-image-push GHCR_OWNER=${{ github.repository_owner }}" >&2
            exit 1
          fi

      # Audits of the static device data: the HAL SFR maps against the
      # DFP proc headers, and every manifest example's #pragma config
      # keys/values against the compiler's config database (validated at
      # link time by a minimal config-TU link). Both are host-side
      # python3 that shells into the toolchain container for the DFP
      # headers / xc8-cc, so this step sits right after the pull, next
      # to the other container-dependent steps.
      - name: Device-data audits (sfr-map, config-key, statics)
        if: steps.docs.outputs.docs_only != 'true'
        env:
          EPIC_TOOLCHAIN_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          python3 scripts/sfr-map-audit.py || audit_status=$?
          python3 scripts/config-key-audit.py || audit_status=$?
          python3 scripts/statics-audit.py || audit_status=$?
          exit "${audit_status:-0}"

      # The rebuild-identity audit: every matrix .hex built twice into
      # separate dirs and sha256-compared, so codegen or layout drift
      # shows up as a reviewable diff instead of a flaky gate (the
      # deterministic-layout hardening roadmap task 5c).
      - name: Hex-rebuild identity audit
        if: steps.docs.outputs.docs_only != 'true'
        env:
          EPIC_TOOLCHAIN_IMAGE: ${{ steps.image.outputs.image }}
        run: python3 scripts/hex-identity-audit.py

      # Resolution (reading the manifest, computing sources, generating
      # bundles) needs python3 and runs here, on the bare runner;
      # everything the container executes below is a pre-emitted POSIX
      # sh script, a plain-text matrix.txt, or an already-generated
      # bundle directory, since the toolchain image deliberately has no
      # python3 AND no jq (docker/ci-toolchain/Dockerfile), so the
      # scripts that run inside it (scripts/ci-target-*.sh) can't parse
      # JSON either; matrix.txt is one "family module mcu" triple per
      # line for exactly that reason. Emits:
      #   - build/<module>/<mcu>/build.sh for every (module, family, mcu)
      #     in the manifest with an example, plus matrix.txt.
      #   - build-sim/<module>/<mcu>/build.sh for the 3 sim-tests entries
      #     (matches scripts/ci-target-sim.sh's own hardcoded list; keep
      #     both in sync by hand if either changes).
      #   - bundles/*.tar.gz for every family, via make_bundle.py.
      - name: Emit real-target + sim build scripts, generate bundles
        if: steps.docs.outputs.docs_only != 'true'
        run: |
          xc8_version="$(grep -m1 '^ARG XC8_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          xc8_install_dir="/opt/microchip/xc8/v${xc8_version}"
          XC8_INSTALL_DIR="$xc8_install_dir" python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, "scripts")
          import epicmanifest

          m = epicmanifest.load(epicmanifest.default_path())
          xc8_install_dir = os.environ["XC8_INSTALL_DIR"]

          # Real-target build scripts, one per (module, family, mcu),
          # plus matrix.txt the build step below loops over. Reuses
          # `epic_build.py matrix`'s own family/module/mcu filter
          # (rather than re-deriving it inline here) so there is exactly
          # one definition of "what's in the matrix" to keep in sync.
          matrix_json = subprocess.run(
              ["python3", "scripts/epic_build.py", "matrix"],
              check=True, capture_output=True, text=True,
          ).stdout
          with open("matrix.txt", "w") as matrix_f:
              for entry in json.loads(matrix_json):
                  fam_name = entry["family"]
                  fam = m.families[fam_name]
                  dfp_dir = f"{xc8_install_dir}/pic/packs/{fam.dfp}/xc8"
                  for pair in entry["modules"].split(";"):
                      name, mcus = pair.split("=")
                      for mcu in mcus.split(","):
                          matrix_f.write(f"{fam_name} {name} {mcu}\n")
                          subprocess.run(
                              ["python3", "scripts/epic_build.py", "build",
                               "--module", name, "--mcu", mcu,
                               "--build-dir", f"build/{name}",
                               "--dfp-dir", dfp_dir],
                              check=True, stdout=subprocess.DEVNULL,
                          )

          # Sim build scripts: one per sim gate in
          # scripts/ci-target-sim.sh's run_one list (keep both in sync
          # by hand; scripts/ci-local-emit.py's SIM_VARIANTS is the
          # local-replica twin of this list).
          for module, mcu in [
              ("epic-tick", "16F877A"),
              ("epic-tick", "18F4550"),
              ("epic-pic16f193x-firmware", "16F1937"),
              ("epic-swuart", "16F877A"),
              ("epic-math", "16F877A"),
              ("epic-math", "18F4550"),
              ("pic16f87xa-hal", "16F877A"),
              ("pic18fxx5x-hal", "18F4550"),
              ("epic-pid", "18F4550"),
              ("epic-fsm", "16F877A"),
              ("epic-adcfilter", "16F877A"),
              ("epic-encoder", "16F877A"),
              ("epic-bus", "16F877A"),
              ("epic-serial", "16F877A"),
              ("epic-lcd", "16F877A"),
              ("epic-debounce", "16F877A"),
              ("epic-console", "18F4550"),
              ("epic-taskmgr", "18F4550"),
              ("epic-settings", "18F4550"),
              ("epic-modbus", "18F4550"),
              ("epic-combo-uart-ssp", "16F877A"),
              ("epic-combo-multitimer", "16F877A"),
              ("epic-combo-adc-uart", "16F877A"),
              ("epic-combo-rb-uart", "16F877A"),
              ("epic-combo-eeprom-isr", "18F4550"),
              ("epic-combo-tick-serial", "16F877A"),
              ("epic-combo-tick-settings", "18F4550"),
              ("epic-combo-taskmgr-serial", "18F4550"),
              ("epic-combo-encoder-tick", "16F877A"),
              ("epic-combo-lcd-tick", "18F4550"),
              ("epic-combo-swuart-tick", "16F877A"),
              ("epic-combo-modbus-full", "18F4550"),
          ]:
              fam = m.family_of(mcu)
              dfp_dir = f"{xc8_install_dir}/pic/packs/{fam.dfp}/xc8"
              subprocess.run(
                  ["python3", "scripts/epic_build.py", "build",
                   "--module", module, "--mcu", mcu, "--variant", "sim",
                   "--build-dir", f"build-sim/{module}",
                   "--dfp-dir", dfp_dir],
                  check=True,
              )

          # Bundles, one per family.
          for fam_name in sorted(m.families):
              subprocess.run(
                  ["python3", "scripts/make_bundle.py",
                   "--family", fam_name, "--version", "ci-test"],
                  check=True,
              )
          PY

      # docker run, not this job's container: field: this job also needs
      # python3 (the step above) and the toolchain image has none, so no
      # single container: value could cover every step in this job.
      # Bind-mounting $PWD instead of upload/download-artifact works
      # because everything above already ran on this same runner's
      # filesystem. EPIC_REPO_ROOT=/work matches build.sh's own
      # 'cd "${EPIC_REPO_ROOT:-.}"' convention; every path inside it is
      # relative from there, so the mount point doesn't matter otherwise.
      #
      # The actual loop logic lives in scripts/ci-target-*.sh (committed,
      # shellcheck-able files), not inlined here: this same payload used
      # to be a docker-run-with-inline-bash-c string, which meant the
      # loop's own quoting had to survive being embedded inside this
      # step's already-quoted YAML `run:` block, a fragile double layer
      # (a literal single quote or an unescaped heredoc terminator inside
      # the inner script would have broken the outer one silently). A
      # real script file has no such problem and can be tested on its
      # own. Neither jq nor python3 exists inside the toolchain image
      # (docker/ci-toolchain/Dockerfile), so ci-target-build.sh reads
      # matrix.txt's plain "family module mcu" lines rather than JSON.
      - name: Real XC8 builds, every family/module/MCU
        if: steps.docs.outputs.docs_only != 'true'
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            "${{ steps.image.outputs.image }}" \
            bash scripts/ci-target-build.sh || build_status=$?
          cat ci-summary-build.md >> "$GITHUB_STEP_SUMMARY"
          exit "${build_status:-0}"

      # scripts/ci-target-sim.sh calls scripts/sim-mdb-run.sh, the same
      # script scripts/sim-test-local.sh also calls for a local repro,
      # so CI and a local run go through one source of truth. wait_ms
      # values (5000, 60000 for pic16f193x) are confirmed-passing
      # wall-clock budgets under MPLAB SIM; see git history on the old
      # sim-tests.yml for how those numbers were established.
      - name: MPLAB SIM (mdb) runs
        if: steps.docs.outputs.docs_only != 'true'
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            "${{ steps.image.outputs.image }}" \
            bash scripts/ci-target-sim.sh || sim_status=$?
          cat ci-summary-sim.md >> "$GITHUB_STEP_SUMMARY"
          exit "${sim_status:-0}"

      # scripts/ci-target-bundle.sh: proves each generated bundle is
      # genuinely self-contained by copying it to /isolated (no repo
      # above it) and building there, ported verbatim from the old
      # bundle-gate.yml's build-isolated job.
      - name: Isolated bundle build
        if: steps.docs.outputs.docs_only != 'true'
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            "${{ steps.image.outputs.image }}" \
            bash scripts/ci-target-bundle.sh || bundle_status=$?
          cat ci-summary-bundle.md >> "$GITHUB_STEP_SUMMARY"
          exit "${bundle_status:-0}"

  # Flake-hunt: REPEAT=N run of every sim gate (quality task 10),
  # manual-trigger only so a hunt does not slow the PR target job.
  # Reuses the target job's emit step and the same ci-target-sim.sh the
  # PR job calls, with REPEAT=5. Output: the per-run breakdown in
  # ci-summary-sim.md (e.g. "PASS (5/5)" / "FAIL (3/5)").
  flake-hunt:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve + pull the toolchain image
        id: image
        run: |
          xc8_version="$(grep -m1 '^ARG XC8_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic16_dfp_version="$(grep -m1 '^ARG PIC16FXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic18_dfp_version="$(grep -m1 '^ARG PIC18FXXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic1216f1_dfp_version="$(grep -m1 '^ARG PIC12_16F1XXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          mplabx_version="$(grep -m1 '^ARG MPLABX_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          tag="xc8-v${xc8_version}-dfp${pic16_dfp_version}-${pic18_dfp_version}-${pic1216f1_dfp_version}-mplabx${mplabx_version}"
          image="ghcr.io/${{ github.repository_owner }}/pic8-hal-ci:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$image"

      - name: Emit sim build scripts
        run: |
          xc8_version="$(grep -m1 '^ARG XC8_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          XC8_INSTALL_DIR="/opt/microchip/xc8/v${xc8_version}" python3 - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, "scripts")
          import epicmanifest
          m = epicmanifest.load(epicmanifest.default_path())
          xc8_install_dir = os.environ["XC8_INSTALL_DIR"]
          for module, mcu in [
              ("epic-tick", "16F877A"), ("epic-tick", "18F4550"),
              ("epic-pic16f193x-firmware", "16F1937"),
              ("epic-swuart", "16F877A"), ("epic-math", "16F877A"),
              ("epic-math", "18F4550"),
              ("pic16f87xa-hal", "16F877A"), ("pic18fxx5x-hal", "18F4550"),
              ("epic-pid", "18F4550"), ("epic-fsm", "16F877A"),
              ("epic-adcfilter", "16F877A"), ("epic-encoder", "16F877A"),
              ("epic-bus", "16F877A"), ("epic-serial", "16F877A"),
              ("epic-lcd", "16F877A"), ("epic-debounce", "16F877A"),
              ("epic-console", "18F4550"), ("epic-taskmgr", "18F4550"),
              ("epic-settings", "18F4550"), ("epic-modbus", "18F4550"),
              ("epic-combo-uart-ssp", "16F877A"),
              ("epic-combo-multitimer", "16F877A"),
              ("epic-combo-adc-uart", "16F877A"),
              ("epic-combo-rb-uart", "16F877A"),
              ("epic-combo-eeprom-isr", "18F4550"),
              ("epic-combo-tick-serial", "16F877A"),
              ("epic-combo-tick-settings", "18F4550"),
              ("epic-combo-taskmgr-serial", "18F4550"),
              ("epic-combo-encoder-tick", "16F877A"),
              ("epic-combo-lcd-tick", "18F4550"),
              ("epic-combo-swuart-tick", "16F877A"),
              ("epic-combo-modbus-full", "18F4550"),
          ]:
              fam = m.family_of(mcu)
              dfp_dir = f"{xc8_install_dir}/pic/packs/{fam.dfp}/xc8"
              subprocess.run(
                  ["python3", "scripts/epic_build.py", "build",
                   "--module", module, "--mcu", mcu, "--variant", "sim",
                   "--build-dir", f"build-sim/{module}",
                   "--dfp-dir", dfp_dir],
                  check=True,
              )
          PY

      - name: REPEAT=5 sim gate hunt
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e REPEAT=5 \
            "${{ steps.image.outputs.image }}" \
            bash scripts/ci-target-sim.sh ci-summary-sim.md || sim_status=$?
          cat ci-summary-sim.md >> "$GITHUB_STEP_SUMMARY"
          exit "${sim_status:-0}"
