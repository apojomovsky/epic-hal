name: ci

# Consolidated CI: replaces host-tests.yml, xc8-build.yml, sim-tests.yml,
# and bundle-gate.yml (deleted). Those four workflows had grown to ~14
# separate job definitions, several matrixed per family or per module,
# producing 26+ individual PR checks for even a one-line change. This
# file collapses that down to 2 jobs:
#
#   - host: bare runner, no Docker. Every module/HAL's cmake+ctest, in one
#     job with an internal loop (same PASS/FAIL step-summary pattern the
#     old xc8-build.yml used for MCU variants), plus the repo's
#     pre-commit checks (trailing whitespace, no em-dash, cppcheck).
#   - target: one Docker pull, then in that single job: every real XC8
#     build across all 3 families, all 3 mdb/MPLAB SIM runs, and the
#     isolated bundle-gate build. The old versions of these three were
#     separate jobs/workflows specifically to get one `container:` per
#     job; this version invokes `docker run` directly per step instead
#     of using the job-level `container:` field, which is what makes it
#     possible to mix python3-only steps (manifest resolution, script
#     emission, bundle generation, none of which the toolchain image can
#     do, see docker/ci-toolchain/Dockerfile's "no python3") with
#     xc8-cc/mdb.sh steps in the same job. Because everything now runs on
#     one runner's filesystem, the old artifact upload/download between
#     jobs is gone too: docker run bind-mounts the checkout directly.
#
# Tradeoff, deliberate: the old per-family/per-module jobs ran
# concurrently (GitHub schedules matrix jobs on separate runners); this
# collapses them into one sequential job each, trading wall-clock time
# for a much shorter PR check list. See
# docs/superpowers/plans/2026-08-06-ci-consolidation.md for the decision.

on:
  push:
    branches: [master]
  pull_request:
  # Manual flake-hunt (REPEAT=5 sim gate run, the flake-hunt job).
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # Bare runner, no Docker: every module/HAL's cmake+ctest plus lint.
  # non-code PRs skip the build+test loop but still run lint (a
  # trailing-whitespace/em-dash violation can live in a .md file too).
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential cppcheck jq

      # Mirrors host-tests.yml's old lint job's base-ref resolution
      # exactly, so the pre-commit diff scan and the non-code/module
      # discovery below always agree on what range they're looking at.
      - name: Determine base ref for the diff scan
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              base="$(git rev-parse HEAD~1 2>/dev/null || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)"
              ;;
          esac
          echo "ref=$base" >> "$GITHUB_OUTPUT"

      # Every module/HAL follows the fixed host-testable contract (see
      # AGENTS.md "Module anatomy"). On a pull_request, narrow to just
      # the modules actually touched plus their transitive dependents
      # (scripts/ci-discover-affected-modules.py); a push to master
      # always gets the full, unfiltered list. Non-code PRs get an
      # empty module list, so the build+test step below is a no-op for
      # them, not an error.
      - name: Discover affected modules
        id: discover
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            modules="$(git ls-files -- '*/CMakeLists.txt' \
              | sed 's#/CMakeLists.txt$##' | sort | jq -R -s -c 'split("\n")[:-1]')"
            echo "modules=$modules" >> "$GITHUB_OUTPUT"
            echo "non_code=false" >> "$GITHUB_OUTPUT"
          else
            result="$(python3 scripts/ci-discover-affected-modules.py \
              '${{ github.event.pull_request.base.sha }}')"
            echo "modules=$(echo "$result" | jq -c '.modules')" >> "$GITHUB_OUTPUT"
            echo "non_code=$(echo "$result" | jq -r '.non_code')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + test every affected module (host)
        if: steps.discover.outputs.non_code != 'true'
        run: |
          fail=0
          { echo "| Module | Result |"; echo "|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          for module in $(echo '${{ steps.discover.outputs.modules }}' | jq -r '.[]'); do
            echo "::group::${module}"
            if cmake -B "build-host/${module}" -S "${module}" \
                 && cmake --build "build-host/${module}" \
                 && ctest --test-dir "build-host/${module}" --output-on-failure; then
              echo "PASS: ${module}"
              echo "| ${module} | PASS |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "FAIL: ${module}"
              echo "| ${module} | FAIL |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"

      # Always runs, even if the loop above failed, so a build break and
      # a lint break both surface in the same run instead of the second
      # one being hidden behind the first.
      - name: Pre-commit checks (trailing whitespace, no em-dash, cppcheck)
        if: always()
        env:
          PRE_COMMIT_BASE_REF: ${{ steps.base.outputs.ref }}
        run: bash scripts/pre-commit-checks.sh

  # Per-family real-target checks (XC8 builds, mdb/MPLAB SIM gates,
  # audits, bundle), each via the reusable family-check workflow: the
  # calls run concurrently on separate runners, so the PR wait is the
  # largest family's time, not the sum. Sharded 2026-08-11 (was one
  # ~23 min target job; the per-family jobs land ~8-10 min wall). A
  # non-code PR skips everything past the pull in every family.
  family-87xa:
    uses: ./.github/workflows/family-check.yml
    with:
      family: PIC16F87XA

  family-18fxx5x:
    uses: ./.github/workflows/family-check.yml
    with:
      family: PIC18Fxx5x

  family-193x:
    uses: ./.github/workflows/family-check.yml
    with:
      family: PIC16F193X

  # Flake-hunt: REPEAT=N run of every sim gate (quality task 10),
  # manual-trigger only so a hunt does not slow the PR target job.
  # Reuses the target job's emit step and the same ci-target-sim.sh the
  # PR job calls, with REPEAT=5. Output: the per-run breakdown in
  # ci-summary-sim.md (e.g. "PASS (5/5)" / "FAIL (3/5)").
  flake-hunt:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve + pull the toolchain image
        id: image
        run: |
          xc8_version="$(grep -m1 '^ARG XC8_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic16_dfp_version="$(grep -m1 '^ARG PIC16FXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic18_dfp_version="$(grep -m1 '^ARG PIC18FXXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic1216f1_dfp_version="$(grep -m1 '^ARG PIC12_16F1XXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          mplabx_version="$(grep -m1 '^ARG MPLABX_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          tag="xc8-v${xc8_version}-dfp${pic16_dfp_version}-${pic18_dfp_version}-${pic1216f1_dfp_version}-mplabx${mplabx_version}"
          image="ghcr.io/${{ github.repository_owner }}/pic8-hal-ci:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$image"

      - name: Emit sim build scripts
        run: |
          xc8_version="$(grep -m1 '^ARG XC8_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          XC8_INSTALL_DIR="/opt/microchip/xc8/v${xc8_version}" python3 - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, "scripts")
          import epicmanifest
          m = epicmanifest.load(epicmanifest.default_path())
          xc8_install_dir = os.environ["XC8_INSTALL_DIR"]
          for module, mcu in [
              ("epic-tick", "16F877A"), ("epic-tick", "18F4550"),
              ("epic-pic16f193x-firmware", "16F1937"),
              ("epic-swuart", "16F877A"), ("epic-math", "16F877A"),
              ("epic-math", "18F4550"),
              ("pic16f87xa-hal", "16F877A"), ("pic18fxx5x-hal", "18F4550"),
              ("epic-pid", "18F4550"), ("epic-fsm", "16F877A"),
              ("epic-adcfilter", "16F877A"), ("epic-encoder", "16F877A"),
              ("epic-bus", "16F877A"),
              ("epic-mcp23x17", "16F877A"), ("epic-serial", "16F877A"),
              ("epic-lcd", "16F877A"), ("epic-debounce", "16F877A"),
              ("epic-console", "18F4550"), ("epic-taskmgr", "18F4550"),
              ("epic-settings", "18F4550"), ("epic-modbus", "18F4550"),
              ("epic-combo-uart-ssp", "16F877A"),
              ("epic-combo-multitimer", "16F877A"),
              ("epic-combo-adc-uart", "16F877A"),
              ("epic-combo-rb-uart", "16F877A"),
              ("epic-combo-eeprom-isr", "18F4550"),
              ("epic-combo-tick-serial", "16F877A"),
              ("epic-combo-tick-settings", "18F4550"),
              ("epic-combo-taskmgr-serial", "18F4550"),
              ("epic-combo-encoder-tick", "16F877A"),
              ("epic-combo-lcd-tick", "18F4550"),
              ("epic-combo-swuart-tick", "16F877A"),
              ("epic-combo-modbus-full", "18F4550"),
              ("epic-combo-rx-loopback", "16F877A"),
          ]:
              # The sim list is shared across merge orders (the
              # rx-loopback module lands on its own PR); skip modules
              # this branch does not have yet.
              if module not in m.modules:
                  continue
              fam = m.family_of(mcu)
              dfp_dir = f"{xc8_install_dir}/pic/packs/{fam.dfp}/xc8"
              subprocess.run(
                  ["python3", "scripts/epic_build.py", "build",
                   "--module", module, "--mcu", mcu, "--variant", "sim",
                   "--build-dir", f"build-sim/{module}",
                   "--dfp-dir", dfp_dir],
                  check=True,
              )
          PY

      - name: REPEAT=5 sim gate hunt
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e REPEAT=5 \
            "${{ steps.image.outputs.image }}" \
            bash scripts/ci-target-sim.sh ci-summary-sim.md || sim_status=$?
          cat ci-summary-sim.md >> "$GITHUB_STEP_SUMMARY"
          exit "${sim_status:-0}"
