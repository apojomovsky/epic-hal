name: sim-tests

# Phase 4 of docs/ci-plan.md: drives the Phase 3 sim-target harness under
# MPLAB SIM (via mdb, headless, confirmed in Phase 2) and turns the
# captured UART output into a real PASS/FAIL CI signal, closing the loop
# Phase 3 left open (build-verified locally, never actually run under a
# simulator, since this environment has no local mdb/GHCR access).
#
# Scoped to the epic-tick pilot for PIC16F87XA/PIC18Fxxxx (Phase 5 rolls
# this out to every module, discovered the same dynamic way xc8-build.yml
# already discovers its own matrix), plus PIC16F193X's own diagnostic
# example directly (pic16f193x-hal has no epic-tick port yet): its
# harness has no UART, so it reports over MODE=gpio instead (RA0 driven
# high/low by epic_harness_report, read back via mdb `print PORTA`, see
# scripts/sim-mdb-run.sh's own header comment).
#
# toolchain-image below is a deliberate, verbatim copy of xc8-build.yml's
# own job, not a shared/reusable workflow: same tag-resolution formula
# means this workflow's `docker pull` gets a cache hit against whatever
# tag `make ci-image-push` last published, same tag xc8-build.yml also
# pulls, so both workflows always agree on which toolchain image is
# current without either one building it (docs/docker-dev-plan.md's "CI
# simplification": CI only ever pulls now, publishing is a local, human-
# triggered step). Factoring this into a `workflow_call` reusable
# workflow is reasonable future cleanup once a second consumer beyond
# these two exists (Phase 5 already anticipates matrixing this file
# further, a better moment to reconsider), not done now.
#
# The mdb script is generated inline (a heredoc, substituting matrix
# values) rather than committed as a per-module mdb-sim-script.txt file
# as this plan's Target layout originally sketched: the content is
# entirely mechanical (device name, hex path, output path, wait time),
# and generating it keeps the one real command sequence (order matters,
# see Phase 2's `set`-before-`hwtool` gotcha) in one place instead of
# duplicated across a growing number of near-identical files once Phase
# 5 rolls this out to every module.
#
# matrix.module names a manifest module (epic-common/manifest/
# modules.toml), not an mcu/*-mplabx path: sim-mdb-run.sh resolves the
# HARNESS=sim build via scripts/epic_build.py build --variant sim,
# which reads the module's DFP and sim-variant sources straight from
# the manifest, so neither is a separate matrix field any more.

on:
  push:
    branches: [master]
  pull_request:

# packages: read only, this workflow only ever pulls now (docs/
# docker-dev-plan.md); publishing the toolchain image is a local,
# human-triggered `make ci-image-push`, not something CI does anymore.
permissions:
  contents: read
  packages: read

jobs:
  # Pull-only, verbatim copy of xc8-build.yml's own toolchain-image job
  # (see this workflow's header comment for why it isn't factored out
  # yet). Fails loudly, with `make ci-image-push` instructions, if the
  # resolved tag isn't on GHCR.
  toolchain-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve version-pinned image tag
        run: |
          xc8_version="$(grep -m1 '^ARG XC8_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic16_dfp_version="$(grep -m1 '^ARG PIC16FXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic18_dfp_version="$(grep -m1 '^ARG PIC18FXXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic1216f1_dfp_version="$(grep -m1 '^ARG PIC12_16F1XXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          mplabx_version="$(grep -m1 '^ARG MPLABX_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          tag="xc8-v${xc8_version}-dfp${pic16_dfp_version}-${pic18_dfp_version}-${pic1216f1_dfp_version}-mplabx${mplabx_version}"
          image="ghcr.io/${{ github.repository_owner }}/pic8-hal-ci:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Resolved image: $image"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull the private toolchain image
        run: |
          image="${{ steps.resolve.outputs.image }}"
          if ! docker pull "$image"; then
            echo "error: no cached $image on GHCR." >&2
            echo "This workflow no longer builds the toolchain image itself" >&2
            echo "(see this workflow's header comment). To publish it:" >&2
            echo "  1. drop the Microchip installers in docker/ci-toolchain/vendor/" >&2
            echo "     (see \`make check-vendor\` for exact filenames)" >&2
            echo "  2. docker login ghcr.io -u <you> (needs a PAT with write:packages)" >&2
            echo "  3. make ci-image-push GHCR_OWNER=${{ github.repository_owner }}" >&2
            exit 1
          fi
          echo "Using cached $image"

  # Docs-only PRs skip the real mdb/MPLAB SIM run below (a prose change
  # cannot affect register/UART output). Always "false" on a push to
  # master. See scripts/ci-docs-only-check.sh's own header; host-
  # tests.yml and xc8-build.yml apply the identical check to their own
  # expensive jobs.
  docs-check:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.docs-only.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: docs-only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            result="$(bash scripts/ci-docs-only-check.sh '${{ github.event.pull_request.base.sha }}')"
          else
            result="false"
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

  # Resolution runs here, on a bare runner with python3, not inside the
  # toolchain container sim-test uses below (which deliberately has
  # none, docker/ci-toolchain/Dockerfile). Emits one HARNESS=sim build
  # script per matrix entry via scripts/epic_build.py build --variant
  # sim; sim-mdb-run.sh (inside the container) only ever executes a
  # pre-emitted script plus mdb.sh, mirroring the split xc8-build.yml
  # and manifest-equivalence.yml already use.
  emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emit a HARNESS=sim build script for each sim-tests entry
        run: |
          xc8_version="$(grep -m1 '^ARG XC8_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          xc8_install_dir="/opt/microchip/xc8/v${xc8_version}"
          XC8_INSTALL_DIR="$xc8_install_dir" python3 - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, "scripts")
          import epicmanifest
          m = epicmanifest.load(epicmanifest.default_path())
          xc8_install_dir = os.environ["XC8_INSTALL_DIR"]
          for module, mcu in [
              ("epic-tick", "16F877A"),
              ("epic-tick", "18F4550"),
              ("epic-pic16f193x-firmware", "16F1937"),
          ]:
              fam = m.family_of(mcu)
              dfp_dir = f"{xc8_install_dir}/pic/packs/{fam.dfp}/xc8"
              subprocess.run(
                  ["python3", "scripts/epic_build.py", "build",
                   "--module", module, "--mcu", mcu, "--variant", "sim",
                   "--build-dir", f"build-sim/{module}",
                   "--dfp-dir", dfp_dir],
                  check=True,
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sim-build-scripts
          path: build-sim/

  sim-test:
    needs: [toolchain-image, docs-check, emit]
    if: needs.docs-check.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.toolchain-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: pic16f87xa
            mcu: 16F877A
            device: PIC16F877A
            module: epic-tick
          - family: pic18fxx5x
            mcu: 18F4550
            device: PIC18F4550
            module: epic-tick
          - family: pic16f193x
            mcu: 16F1937
            device: PIC16F1937
            module: epic-pic16f193x-firmware
            mode: gpio
            wait_ms: 60000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sim-build-scripts
          path: build-sim/
      - name: Build + run under MPLAB SIM (mdb), check the PASS/FAIL marker
        # scripts/sim-mdb-run.sh: the exact same script scripts/sim-test-
        # local.sh calls for a local repro run against the same toolchain
        # image (docs/ci-plan.md's local-reproduction plan), so CI and a
        # local run go through one source of truth, not two copies of
        # this logic that can drift apart. Command order matters inside
        # it: `set` tool-property commands must come before `hwtool`,
        # silently ignored otherwise (Phase 2 finding).
        #
        # wait_ms: 5000 (5 real seconds) default, matrix-overridden for
        # pic16f193x. MPLAB SIM runs noticeably slower than real-time
        # (confirmed empirically, not a documented spec), so this is a
        # wall-clock budget, not a simulated-time one, and pic18fxx5x
        # needs more of it than pic16f87xa does to reach the harness's
        # report() call (more peripherals to init at a fixed 48 MHz
        # FOSC). A leftover debug value of 80ms (from isolating a
        # since-fixed bug, see pic18fxx5x-hal/docs/ARCHITECTURE.md Finding
        # 3) starved pic18fxx5x of real time here for a while after that
        # fix landed, producing the same "no UART output" symptom for an
        # unrelated reason; confirmed reproducing this exact CI image
        # locally that 80/500ms fail and 2000/5000ms reliably pass, picked
        # 5000 for margin over the confirmed-passing 2000 baseline.
        #
        # pic16f193x's example_timer1.c loops SIM_CYCLES=2_000_000 C-level
        # iterations (not machine cycles) before calling report(), far
        # more wall-clock time under MPLAB SIM than the other two
        # families' examples need: confirmed locally that 20000ms fails
        # (PORTA never set, halted mid-loop) and 30000/40000/60000ms
        # reliably pass, picked 60000 for the same margin-over-confirmed-
        # passing logic as pic18fxx5x's 5000 above. This is the actual
        # root cause of PIC16F193X's mdb gate never having been wired up
        # here before now (previously tracked as "mdb still pending"):
        # not a firmware bug, a wait-time budget too short for this
        # family's diagnostic example, identical failure mode confirmed
        # on both a pre- and post-image-trim toolchain image.
        shell: bash
        run: |
          scripts/sim-mdb-run.sh ${{ matrix.family }} ${{ matrix.mcu }} \
            ${{ matrix.device }} ${{ matrix.module }} \
            ${{ matrix.wait_ms || 5000 }} ${{ matrix.mode || 'uart' }}
      - name: Upload captured sim output (debugging aid on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-${{ matrix.mode || 'uart' }}-${{ matrix.family }}
          path: /tmp/${{ matrix.family }}-${{ matrix.mode || 'uart' }}.txt
          if-no-files-found: ignore
