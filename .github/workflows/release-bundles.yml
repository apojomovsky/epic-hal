name: release-bundles

# Tag-triggered: builds one source bundle per family, proves each one
# builds from a scratch directory outside any repo checkout, and only
# then attaches the tarballs to a GitHub Release.
#
# Nothing generated is committed; bundles exist only as release assets.
# The gate is the same idea as bundle-gate.yml, repeated here because a
# release must never publish an artifact it has not itself built.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v0.1.0), for a dry run"
        required: true

permissions:
  contents: write
  packages: read

jobs:
  toolchain-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          xc8_version="$(grep -m1 '^ARG XC8_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic16_dfp_version="$(grep -m1 '^ARG PIC16FXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic18_dfp_version="$(grep -m1 '^ARG PIC18FXXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic1216f1_dfp_version="$(grep -m1 '^ARG PIC12_16F1XXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          mplabx_version="$(grep -m1 '^ARG MPLABX_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          tag="xc8-v${xc8_version}-dfp${pic16_dfp_version}-${pic18_dfp_version}-${pic1216f1_dfp_version}-mplabx${mplabx_version}"
          echo "image=ghcr.io/${{ github.repository_owner }}/pic8-hal-ci:${tag}" >> "$GITHUB_OUTPUT"
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker pull "${{ steps.resolve.outputs.image }}"

  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"
      - name: Generate every family's bundle
        run: |
          python3 - <<'PY' > families.txt
          import sys
          sys.path.insert(0, "scripts")
          import epicmanifest
          m = epicmanifest.load(epicmanifest.default_path())
          for name in sorted(m.families):
              print(name)
          PY
          while read -r fam; do
            python3 scripts/make_bundle.py \
              --family "$fam" --version "${{ steps.version.outputs.version }}"
          done < families.txt
      - name: Emit the standalone epic-hal CLI asset
        run: |
          # Consumer bundles are pure libraries; the scaffolder CLI
          # (Python + manifest) ships as its own asset install.sh fetches
          # alongside a bundle. Created before the checksum step so its
          # SHA-256 lands in SHA256SUMS.
          python3 scripts/make_bundle.py --cli --version "${{ steps.version.outputs.version }}"
      - name: Checksum the tarballs
        run: |
          cd bundles
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Emit the part-to-family map
        run: |
          # install.sh resolves a part (16F877A) to its family from this
          # asset before downloading the bundle; derived from the manifest
          # so it cannot drift from the bundles it describes.
          python3 - <<'PY' > bundles/parts.txt
          import sys
          sys.path.insert(0, "scripts")
          import bundlegen, epicmanifest
          m = epicmanifest.load(epicmanifest.default_path())
          sys.stdout.write(bundlegen.emit_parts_map(m))
          PY
          cat bundles/parts.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: bundles/

  gate:
    needs: [toolchain-image, build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.toolchain-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: /tmp/bundles
      - name: Verify the checksums
        run: cd /tmp/bundles && sha256sum -c SHA256SUMS
      - name: Build every bundle outside any repo checkout
        shell: bash
        run: |
          # /isolated has no repo above it, so a path escaping a bundle
          # cannot accidentally resolve through the source tree.
          mkdir -p /isolated && cd /isolated
          fail=0
          for tarball in /tmp/bundles/*.tar.gz; do
            name="$(basename "$tarball" .tar.gz)"
            # The standalone CLI asset is not a family bundle; the
            # installer-gate job exercises it end to end instead.
            case "$name" in
              epic-hal-cli-*) echo "SKIP $name: standalone CLI asset"; continue ;;
            esac
            tar xzf "$tarball" -C /isolated
            cd "/isolated/$name"

            for required in epic-hal.mk epic-hal-sources.json SUPPORT.md \
                            QUICKSTART.md MPLABX.md VERSION LICENSE; do
              if [ ! -f "$required" ]; then
                echo "FAIL $name: missing $required"
                fail=1
              fi
            done
            if [ ! -d examples/epic-hal-demo.X ]; then
              echo "FAIL $name: missing examples/epic-hal-demo.X"
              fail=1
            else
              (
                cd examples/epic-hal-demo.X
                "$MPLABX_INSTALL_DIR/mplab_platform/bin/prjMakefilesGenerator.sh" . \
                  >/dev/null 2>&1 || true
                if make -f nbproject/Makefile-default.mk SUBPROJECTS= .build-conf \
                     >project.log 2>&1; then
                  echo "PASS $name (epic-hal-demo.X)"
                else
                  echo "FAIL $name: epic-hal-demo.X did not build"
                  cat project.log
                  exit 1
                fi
              ) || fail=1
            fi

            module="$(grep -m1 '^EPIC_HAL_MODULE_' epic-hal.mk \
              | sed 's/^EPIC_HAL_MODULE_\([^ ]*\).*/\1/' || true)"
            if [ -z "$module" ]; then
              echo "SKIP $name: HAL-only bundle, nothing to link"
              cd /isolated
              continue
            fi
            part="$(grep -m1 "^EPIC_HAL_SUPPORTED_epic-$module " epic-hal.mk \
              | awk '{print $3}')"
            dfp_name="$(grep -m1 '^EPIC_HAL_DFP' epic-hal.mk | awk '{print $3}')"

            cat > Makefile <<EOF
          EPIC_HAL_DIR := .
          EPIC_HAL_MCU := $part
          EPIC_HAL_MODULES := $module
          include \$(EPIC_HAL_DIR)/epic-hal.mk
          DFP := $XC8_INSTALL_DIR/pic/packs/$dfp_name/xc8
          all:
          	xc8-cc -mdfp=\$(DFP) -mcpu=\$(shell echo \$(EPIC_HAL_MCU) | tr A-Z a-z) \\
          	  -O2 -std=c99 -Wall -Wextra \$(EPIC_HAL_CFLAGS) -DFOSC_HZ=20000000 \\
          	  \$(EPIC_HAL_SRCS) main.c -o app.hex -ginhx32
          EOF
            printf 'void main(void) { for (;;) { } }\n' > main.c

            if make >build.log 2>&1 && [ -f app.hex ]; then
              echo "PASS $name ($module on $part)"
            else
              echo "FAIL $name ($module on $part)"
              cat build.log
              fail=1
            fi
            cd /isolated
          done
          exit "$fail"

  # install.sh is itself a release asset, so the gate must not publish
  # an installer it has not run. This job runs on the bare runner (not
  # in the toolchain container): install.sh's scaffold step delegates
  # to the bundle's `epic-hal` CLI, a plain python3 script, and the
  # toolchain image deliberately has no python3. Each family's bundle
  # is installed through the real script against the downloaded
  # artifacts (file:// flat dir, explicit version), then the scaffolded
  # project is built in the toolchain container the same way
  # family-check does (docker run with $PWD mounted at /work). Any
  # family failure fails the job.
  installer-gate:
    needs: [toolchain-image, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: /tmp/bundles
      - name: Resolve + pull the toolchain image
        id: image
        run: |
          xc8_version="$(grep -m1 '^ARG XC8_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic16_dfp_version="$(grep -m1 '^ARG PIC16FXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic18_dfp_version="$(grep -m1 '^ARG PIC18FXXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic1216f1_dfp_version="$(grep -m1 '^ARG PIC12_16F1XXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          mplabx_version="$(grep -m1 '^ARG MPLABX_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          tag="xc8-v${xc8_version}-dfp${pic16_dfp_version}-${pic18_dfp_version}-${pic1216f1_dfp_version}-mplabx${mplabx_version}"
          image="ghcr.io/${{ github.repository_owner }}/pic8-hal-ci:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$image"
      - name: Install every family and build its scaffold
        env:
          EPIC_TOOLCHAIN_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          fail=0
          base="$GITHUB_WORKSPACE"
          # Part form: install.sh resolves each part to its family via
          # parts.txt, which exercises that asset plus the family
          # resolution end to end.
          for part in 16F877A 18F4550 16F1939; do
            echo "=== install.sh $part ==="
            mkdir -p "$base/install-$part"
            # install.sh scaffolds in the current directory (in place),
            # so run it from the per-part dir to keep each scaffold
            # isolated; the bundle is vendored at ./third_party/epic-hal
            # inside that dir and the scaffold's paths point at it.
            if ! (
              cd "$base/install-$part"
              EPIC_HAL_BASE_URL="file:///tmp/bundles" \
              EPIC_HAL_DIR="$base/install-$part/epic-hal" \
                sh "$base/install.sh" "$part" "${{ needs.build.outputs.version }}"
            ) || ! docker run --rm -v "$PWD:/work" -w /work \
                "$EPIC_TOOLCHAIN_IMAGE" \
                bash -c "cd /work/install-$part && make && test -f build/myapp.hex"; then
              echo "FAIL install-$part"
              fail=1
            fi
          done
          exit "$fail"
      - name: Exercise the latest-version resolution branch against a local mock
        run: |
          # The real releases/latest redirect cannot be exercised here:
          # at gate time the release for the tag being built does not
          # exist yet, so the actual latest-download path stays
          # inherently untestable until a release exists. This step
          # covers the resolution logic itself (curl redirect following,
          # the %{url_effective} final URL, and the ${resolved##*/} tag
          # extraction) against a local 302 mock.
          python3 - <<'PY'
          import http.server
          import os
          import subprocess
          import threading

          class Mock(http.server.BaseHTTPRequestHandler):
              # One 302 from /latest, like the real releases/latest
              # endpoint; the redirect target answers 200 so curl
              # terminates instead of looping.
              def do_GET(self):
                  if self.path == "/latest":
                      self.send_response(302)
                      self.send_header("Location", "/releases/tag/ci-test")
                  else:
                      self.send_response(200)
                  self.end_headers()

              def log_message(self, *args):
                  pass

          server = http.server.HTTPServer(("127.0.0.1", 0), Mock)
          port = server.server_address[1]
          threading.Thread(target=server.serve_forever, daemon=True).start()

          # The exact resolution snippet from install.sh.
          script = '''set -eu
          resolved="$(curl -fsSL -o /dev/null -w '%{url_effective}' "$BASE_URL/latest")"
          version="${resolved##*/}"
          [ -n "$version" ] && [ "$version" != "latest" ] || {
              echo "install.sh: could not resolve the latest release version" >&2
              exit 1
          }
          printf '%s\\n' "$version"
          '''
          env = dict(os.environ)
          env["BASE_URL"] = "http://127.0.0.1:%d" % port
          out = subprocess.run(["sh", "-c", script], env=env,
                               capture_output=True, text=True)
          server.shutdown()
          server.server_close()
          resolved = out.stdout.strip()
          if out.returncode != 0 or resolved != "ci-test":
              print("FAIL: expected 'ci-test', got %r" % resolved)
              print(out.stderr)
              raise SystemExit(1)
          print("PASS: latest-resolution branch resolved", resolved)
          PY

  publish:
    needs: [build, gate, installer-gate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release_notes.py walks back to the previous tag, so the tags and
          # the commits between them must both be present.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: bundles
      - name: Write the release notes
        run: |
          version="${{ needs.build.outputs.version }}"
          repo_url="${{ github.server_url }}/${{ github.repository }}"
          {
            echo "## Epic HAL $version"
            echo
            python3 scripts/release_notes.py "$version" --repo-url "$repo_url"
            echo
            echo "## Using it"
            echo
            echo "One source bundle per family. Download the one for your part,"
            echo "unpack it, and point \`EPIC_HAL_DIR\` at it:"
            echo
            echo '```make'
            echo 'EPIC_HAL_DIR := third_party/epic-hal'
            echo 'EPIC_HAL_MCU := 16F877A'
            echo 'EPIC_HAL_MODULES := serial tick'
            echo 'include $(EPIC_HAL_DIR)/epic-hal.mk'
            echo
            echo 'SRCS := main.c $(EPIC_HAL_SRCS)'
            echo 'CFLAGS += $(EPIC_HAL_CFLAGS)'
            echo '```'
            echo
            echo "This is a 0.x release: pin this tag, the \`epic-hal.mk\`"
            echo "interface may still change. Per-part support (not every"
            echo "module fits on every part) is in each bundle's"
            echo "\`SUPPORT.md\`; build notes are in \`QUICKSTART.md\` and"
            echo "\`MPLABX.md\`, alongside a reference MPLAB X project under"
            echo "\`examples/\`."
            echo
            echo "<details><summary>Checksums</summary>"
            echo
            echo "Every bundle here was built from a scratch directory outside"
            echo "the repository before publication."
            echo
            echo '```'
            cat bundles/SHA256SUMS
            echo '```'
            echo
            echo "</details>"
          } > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.build.outputs.version }}" \
            --title "Epic HAL ${{ needs.build.outputs.version }}" \
            --notes-file notes.md \
            bundles/*.tar.gz bundles/SHA256SUMS bundles/parts.txt install.sh
