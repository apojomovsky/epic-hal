name: cut-release

# Cuts a release: regenerates CHANGELOG.md from Conventional Commit history,
# lands it on master via an auto-merged PR, then tags the result. Pushing
# the tag is what release-bundles.yml reacts to (push: tags: v*); this
# workflow never builds bundles or calls `gh release create` itself.
#
# master's ruleset requires a PR with required checks green, so this opens
# a release PR and auto-merges it. Uses EPIC_TASKS_TOKEN (a PAT, already a
# repo secret) to push the branch and open the PR: a PR opened with the
# default GITHUB_TOKEN never triggers other workflows (GitHub's
# loop-prevention rule), so its required checks would never run and it
# would sit BLOCKED forever, confirmed the hard way on the sibling epic-cc
# workflow (PR #417).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  pull-requests: write

jobs:
  cut-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
          token: ${{ secrets.EPIC_TASKS_TOKEN }}

      - uses: ./.github/actions/setup-git-cliff

      - name: Resolve the next version
        id: version
        run: |
          set -eu
          bump="${{ inputs.bump }}"
          if [ "$bump" = "auto" ]; then
            next="$(git-cliff --bumped-version)"
          else
            latest="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"
            if [ -z "$latest" ]; then
              echo "cut-release: no existing vX.Y.Z tag to bump from" >&2
              exit 1
            fi
            core="${latest#v}"
            major="${core%%.*}"
            rest="${core#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            # 10#: force decimal, so a leading-zero component (v1.08.2)
            # isn't misread as an (often invalid) octal literal.
            major=$((10#$major)); minor=$((10#$minor)); patch=$((10#$patch))
            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            next="v${major}.${minor}.${patch}"
          fi
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "cut-release: tag $next already exists" >&2
            exit 1
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "cut-release: cutting $next"

      - name: Regenerate CHANGELOG.md
        run: |
          git-cliff --tag "${{ steps.version.outputs.next }}" -o CHANGELOG.md
          # git-cliff always leaves a trailing blank line; the repo's
          # whitespace gate (scripts/pre-pr-check.sh) rejects one.
          printf '%s\n' "$(cat CHANGELOG.md)" > CHANGELOG.md

      - name: Open the release PR and enable auto-merge
        id: pr
        env:
          GH_TOKEN: ${{ secrets.EPIC_TASKS_TOKEN }}
        run: |
          set -eu
          next="${{ steps.version.outputs.next }}"
          branch="chore/release-${next}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add CHANGELOG.md
          git commit -m "chore(release): ${next}"
          git push origin "$branch"
          url="$(gh pr create --base master --head "$branch" \
            --title "chore(release): ${next}" \
            --body "Automated release PR (cut-release.yml). Merging tags the resulting commit as ${next}.")"
          number="${url##*/}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          gh pr merge "$number" --auto --squash

      - name: Wait for the release PR to merge
        id: merged
        env:
          GH_TOKEN: ${{ secrets.EPIC_TASKS_TOKEN }}
        run: |
          set -eu
          number="${{ steps.pr.outputs.number }}"
          for _ in $(seq 1 90); do
            state="$(gh pr view "$number" --json state --jq .state)"
            if [ "$state" = "MERGED" ]; then
              sha="$(gh pr view "$number" --json mergeCommit --jq .mergeCommit.oid)"
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "::error::release PR #$number was closed without merging"
              exit 1
            fi
            sleep 20
          done
          echo "::error::release PR #$number did not merge within 30 minutes"
          exit 1

      - name: Tag the merged release commit
        run: |
          set -eu
          next="${{ steps.version.outputs.next }}"
          sha="${{ steps.merged.outputs.sha }}"
          git fetch origin "$sha"
          git tag -a "$next" "$sha" -m "Epic HAL ${next}"
          git push origin "refs/tags/${next}"
