name: host-tests

# Phase 0 of docs/ci-plan.md: host CMake/ctest matrix + the repo's own
# pre-commit checks, re-run as an explicit CI step. No XC8, no MPLAB X, no
# Docker here; see xc8-build.yml (Phase 1) for the real-target build.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Every module and HAL follows the same fixed contract (see AGENTS.md
  # "Module anatomy"): a top-level CMakeLists.txt, host-testable via
  # `cmake -B build && cmake --build build && ctest`. Discover that set
  # from tracked files rather than hand-listing it here, so a new module
  # is picked up without a workflow edit.
  #
  # On a pull_request, also narrows that set: a docs-only diff (every
  # changed file is a .md or lives under a docs/ dir) skips build-test
  # entirely, and any other diff is narrowed to just the modules actually
  # touched plus their transitive dependents (scripts/
  # ci-discover-affected-modules.py walks each module's own CMakeLists.txt
  # for its sibling deps, no separately-maintained graph to drift). A push
  # to master always gets the full, unfiltered module list: this
  # filtering exists to make PR iteration faster, not to ever be the only
  # thing standing between a real break and master, so a wrong narrowing
  # on some PR can only ever delay when a break is caught, not let it
  # merge silently. Any change outside a known module dir and outside
  # epic-common/ (a workflow file, the root Makefile, docker/, scripts/
  # itself) falls back to the full matrix rather than guessing.
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
      docs_only: ${{ steps.discover.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: discover
        run: |
          full_modules="$(git ls-files -- '*/CMakeLists.txt' \
            | sed 's#/CMakeLists.txt$##' \
            | sort \
            | jq -R -s -c 'split("\n")[:-1]')"

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "modules=$full_modules" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "push to master: full $(echo "$full_modules" | jq 'length')-module matrix, no filtering"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          result="$(python3 scripts/ci-discover-affected-modules.py "$base")"
          docs_only="$(echo "$result" | jq -r '.docs_only')"
          modules="$(echo "$result" | jq -c '.modules')"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  build-test:
    needs: discover
    if: needs.discover.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - name: Configure
        run: cmake -B build -S ${{ matrix.module }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install lint toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      - name: Determine base ref for the diff scan
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # "before" is all-zeros on the first push of a new branch (and
          # base can be empty in other edge-triggered cases); fall back to
          # the previous commit, or the empty tree if there isn't one.
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              base="$(git rev-parse HEAD~1 2>/dev/null || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)"
              ;;
          esac
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: Run pre-commit checks (trailing whitespace, no em-dash, cppcheck)
        env:
          PRE_COMMIT_BASE_REF: ${{ steps.base.outputs.ref }}
        run: bash scripts/pre-commit-checks.sh
