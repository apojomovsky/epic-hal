name: xc8-build

# Phase 1 of docs/ci-plan.md: real-target XC8 builds, both families, every
# MCU variant, every module with an mcu/*-mplabx tree. Phase 2 adds MPLAB
# X IDE (for mdb.sh) to the same toolchain image; no simulator wiring yet
# (that's Phase 4), this workflow still only proves every combination
# produces a .hex.
#
# Five jobs:
#   - ci-assets: resolves a version-pinned tag for the XC8-installer
#     "blob carrier" image (docker/ci-assets/Dockerfile) and reuses it via
#     `docker pull` if it already exists on GHCR; fails loudly, with
#     reseed instructions, if it doesn't (no auto-fetch fallback, see
#     "why no fallback" below). This exists to fix a real problem: an
#     earlier version of this pipeline re-hosted the XC8 installer as a
#     public GitHub Release asset, which turned out to itself be
#     redistribution (confirmed: `docker pull` worked with zero auth),
#     not authorized by Microchip's EULA (a *use* license, not a
#     redistribution one). See docs/ci-plan.md for the full account.
#   - ci-assets-mplabx: same pattern, one asset behind, for MPLAB X IDE.
#   - toolchain-image: needs both ci-assets jobs; extracts both installers
#     from those private images into docker/ci-toolchain/vendor/ (`docker
#     create` + `docker cp`, never `docker run`, there's nothing to run),
#     then resolves a version-pinned tag for the actual toolchain image
#     and reuses it via `docker pull` if it already exists on GHCR, only
#     building+pushing on a cache miss.
#   - discover: finds every mcu/*-mplabx/Makefile from tracked files (no
#     hardcoded module list, same discipline as host-tests.yml's module
#     discovery), one matrix entry per FAMILY (not per module, and not per
#     module x MCU) with that family's modules (each module's dir + its
#     allowed MCU variants, packed into one bash-parseable string, see
#     scripts/ci-discover-xc8-matrix.py's header) and DFP pack name
#     attached.
#   - build: matrices over discover's output, ONE JOB PER FAMILY (not per
#     module, not per MCU variant): the container image is pulled once
#     per job either way, so even one job per module (23 of them, the
#     previous version of this workflow) paid for 23 redundant multi-GB
#     pulls to do a few seconds of real compiling each, and a fully
#     exploded per-MCU matrix (112 jobs before excluding known-broken
#     pairs) was worse still, badly bottlenecked by GitHub's
#     concurrent-job cap besides. Grouping by family cuts that to 2 pulls
#     while keeping PIC16/PIC18 builds running concurrently. Each job
#     loops over every module in its family and every MCU variant within
#     that module, keeps going past a failing module or variant instead of
#     stopping at the first one, and reports per-module-per-variant
#     PASS/FAIL in $GITHUB_STEP_SUMMARY, so a red job still tells you
#     exactly which module/variant broke without diving into raw logs.
#
# Both GHCR packages (pic8-hal-ci, pic8-hal-ci-assets) are manually
# confirmed private (checked with `docker logout ghcr.io && docker pull`,
# both returned "unauthorized"). `gh api PATCH .../visibility` with
# GITHUB_TOKEN was tried first and did NOT work (the token lacks whatever
# scope that endpoint needs), despite the step exiting 0, so that attempt
# was removed rather than left in as false confidence. Visibility is a
# manual, one-time setting per package (its own Settings page, "Danger
# Zone"), not something this workflow re-asserts on every run.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  ci-assets:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve version-pinned asset image tag
        run: |
          xc8_version="$(grep -m1 '^ARG XC8_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          tag="xc8-v${xc8_version}-installer"
          image="ghcr.io/${{ github.repository_owner }}/pic8-hal-ci-assets:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Resolved asset image: $image"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull the private asset image
        # No auto-fetch-and-seed fallback here on purpose (there was one,
        # briefly, for the one-time migration off the old public release;
        # removed once that migration was confirmed done). A silent
        # fallback that fetches from *somewhere* on a cache miss is exactly
        # how this repo ended up publicly redistributing Microchip's
        # installer the first time; failing loudly with instructions is
        # the right default for "this vendor file isn't where we expected."
        run: |
          image="${{ steps.resolve.outputs.image }}"
          if ! docker pull "$image"; then
            echo "error: no cached $image on GHCR." >&2
            echo "This job does not auto-fetch vendor installers (see this" >&2
            echo "workflow's header comment for why). To reseed: get the" >&2
            echo "installer file privately (not a public URL), then locally:" >&2
            echo "  docker login ghcr.io -u <you> (needs a PAT with write:packages)" >&2
            echo "  docker build -t $image -f docker/ci-assets/Dockerfile <dir-containing-just-that-file>" >&2
            echo "  docker push $image" >&2
            exit 1
          fi
          echo "Using cached $image"

  # Same pattern as ci-assets, one asset behind, for MPLAB X IDE (Phase 2,
  # needed only for mdb.sh). Its one-time bootstrap fallback was removed
  # once seeding was confirmed (docs/ci-plan.md), same as ci-assets's was.
  ci-assets-mplabx:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve version-pinned asset image tag
        run: |
          mplabx_version="$(grep -m1 '^ARG MPLABX_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          tag="mplabx-v${mplabx_version}-installer"
          image="ghcr.io/${{ github.repository_owner }}/pic8-hal-ci-assets:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Resolved asset image: $image"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull the private asset image
        run: |
          image="${{ steps.resolve.outputs.image }}"
          if ! docker pull "$image"; then
            echo "error: no cached $image on GHCR." >&2
            echo "This job does not auto-fetch vendor installers (see this" >&2
            echo "workflow's header comment for why). To reseed: get the" >&2
            echo "installer file privately (not a public URL), then locally:" >&2
            echo "  docker login ghcr.io -u <you> (needs a PAT with write:packages)" >&2
            echo "  docker build -t $image -f docker/ci-assets/Dockerfile <dir-containing-just-that-file>" >&2
            echo "  docker push $image" >&2
            exit 1
          fi
          echo "Using cached $image"

  toolchain-image:
    needs: [ci-assets, ci-assets-mplabx]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Extract the installers from the private asset images
        run: |
          mkdir -p docker/ci-toolchain/vendor

          docker pull "${{ needs.ci-assets.outputs.image }}"
          docker create --name asset-extract-xc8 "${{ needs.ci-assets.outputs.image }}"
          docker cp asset-extract-xc8:/xc8-installer.run docker/ci-toolchain/vendor/xc8-installer.run
          docker rm asset-extract-xc8

          docker pull "${{ needs.ci-assets-mplabx.outputs.image }}"
          docker create --name asset-extract-mplabx "${{ needs.ci-assets-mplabx.outputs.image }}"
          docker cp asset-extract-mplabx:/mplabx-installer.tar docker/ci-toolchain/vendor/mplabx-installer.tar
          docker rm asset-extract-mplabx
      - id: resolve
        name: Resolve version-pinned image tag
        run: |
          xc8_version="$(grep -m1 '^ARG XC8_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic16_dfp_version="$(grep -m1 '^ARG PIC16FXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic18_dfp_version="$(grep -m1 '^ARG PIC18FXXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          mplabx_version="$(grep -m1 '^ARG MPLABX_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          tag="xc8-v${xc8_version}-dfp${pic16_dfp_version}-${pic18_dfp_version}-mplabx${mplabx_version}"
          image="ghcr.io/${{ github.repository_owner }}/pic8-hal-ci:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Resolved image: $image"
      - name: Pull cached image, or build and push it
        run: |
          image="${{ steps.resolve.outputs.image }}"
          if docker pull "$image"; then
            echo "Reusing cached $image"
          else
            echo "No cached $image, building it"
            docker build -t "$image" docker/ci-toolchain
            docker push "$image"
          fi

  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: discover
        run: |
          matrix="$(python3 scripts/ci-discover-xc8-matrix.py)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: [toolchain-image, discover]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.toolchain-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify every module/MCU in ${{ matrix.family }}
        # Explicit shell: bash, not this job's implicit default. A
        # `container:` job defaults to `sh`, unlike a bare `runs-on` job
        # which defaults to `bash`; this script uses `<<<` here-strings
        # and `read -ra` arrays, neither valid under `sh -e` ("Syntax
        # error: redirection unexpected", confirmed against a real failed
        # run before this fix, see the commit that added this comment).
        # The old per-module version never hit this: it only used a
        # POSIX `for mcu in $list` loop, no arrays.
        shell: bash
        # One job per family, not one per module or per (module, MCU):
        # with the image pulled once by the `container:` directive above,
        # looping over every module and every MCU variant here is what
        # actually saves the redundant multi-GB pulls a per-module matrix
        # (23 jobs) or a fully-exploded per-MCU matrix (112 jobs) would
        # pay for a few seconds of real compiling each. fail-fast is off
        # at the job level (above, though with only 2 jobs it barely
        # matters), and neither loop below stops at the first failure
        # either: a broken module doesn't hide results for the rest of
        # the family, and a broken MCU variant doesn't hide the rest of
        # that module's variants. The job still fails overall if anything
        # failed ($fail below), and $GITHUB_STEP_SUMMARY lists exactly
        # which module/MCU. matrix.modules is "dir=mcu,mcu;dir=mcu,..."
        # (see scripts/ci-discover-xc8-matrix.py's header for why it's a
        # flat string and not nested JSON: no python3/jq in this
        # container). DFP_DIR: neither DFP is bundled with the standalone
        # XC8 v4.00 install (see docker/ci-toolchain/Dockerfile), and each
        # Makefile's own DFP_DIR default still points at the repo's
        # documented v3.10 path, so it has to be overridden
        # ($XC8_INSTALL_DIR is set by the image itself, matrix.dfp by
        # scripts/ci-discover-xc8-matrix.py).
        run: |
          fail=0
          {
            echo "| Module | MCU | Result |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          IFS=';' read -ra module_entries <<< "${{ matrix.modules }}"
          for entry in "${module_entries[@]}"; do
            dir="${entry%%=*}"
            mcus="${entry#*=}"
            IFS=',' read -ra mcu_list <<< "$mcus"
            for mcu in "${mcu_list[@]}"; do
              echo "::group::${dir} MCU=${mcu}"
              # build/ is shared across every MCU a module's inner loop
              # builds (same checkout, same job), so a bare *.hex glob
              # after the second iteration matches every prior MCU's .hex
              # too, not just this one, caught by testing this locally
              # before trusting it. Every module's TARGET starts with
              # $(MCU)-, confirmed across all Makefiles, so glob on that
              # prefix instead of "*.hex", on top of a clean between
              # iterations for a truly fresh compile.
              make -C "$dir" clean >/dev/null 2>&1 || true
              if make -C "$dir" MCU="${mcu}" \
                   DFP_DIR="${XC8_INSTALL_DIR}/pic/packs/${{ matrix.dfp }}/xc8" \
                 && [ "$(ls "$dir"/build/${mcu}-*.hex 2>/dev/null | wc -l)" -eq 1 ]; then
                echo "PASS: ${dir} ${mcu}"
                echo "| ${dir} | ${mcu} | PASS |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "FAIL: ${dir} ${mcu}"
                echo "| ${dir} | ${mcu} | FAIL |" >> "$GITHUB_STEP_SUMMARY"
                fail=1
              fi
              echo "::endgroup::"
            done
          done
          exit "$fail"
