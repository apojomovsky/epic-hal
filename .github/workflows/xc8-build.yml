name: xc8-build

# Phase 1 of docs/ci-plan.md: real-target XC8 builds, both families, every
# MCU variant, every module with an mcu/*-mplabx tree. Phase 2 adds MPLAB
# X IDE (for mdb.sh) to the same toolchain image; no simulator wiring yet
# (that's Phase 4), this workflow still only proves every combination
# produces a .hex.
#
# Three jobs (down from five, see docs/docker-dev-plan.md's "CI
# simplification"):
#   - toolchain-image: resolves the version-pinned tag for the toolchain
#     image and `docker pull`s it; fails loudly, with `make
#     ci-image-push` instructions, if that tag doesn't exist on GHCR yet.
#     This workflow no longer builds the image itself: the root
#     `Makefile` (`make image`, from installers dropped in
#     docker/ci-toolchain/vendor/ by a human) is now the only place that
#     builds it, and `make ci-image-push` is how a human with
#     write:packages access publishes it to the same private GHCR tag
#     this job pulls. The old `ci-assets`/`ci-assets-mplabx` jobs (an
#     installer "blob carrier" mechanism that let a CI runner build the
#     image itself without a public download URL) are retired, not
#     deleted: `docker/ci-assets/Dockerfile` still exists as a fallback
#     if CI ever needs to build this image again, see its own header and
#     docs/ci-plan.md for why it existed (Microchip's EULA is a *use*
#     license, not a redistribution one, so neither the installer nor the
#     resulting image can ever be public; confirmed the hard way when an
#     earlier version of this pipeline made both reachable by an
#     unauthenticated `docker pull`).
#   - discover: reads epic-common/manifest/modules.toml (the single
#     source of truth for what builds where, see
#     epic-common/manifest/README.md), one matrix entry per FAMILY (not
#     per module, and not per module x MCU) with that family's modules
#     (each module's name + its allowed MCU variants, packed into one
#     bash-parseable string, see scripts/epic_build.py's `matrix`
#     subcommand) and DFP pack name attached. Also emits a build script
#     per (module, MCU) pair via scripts/epic_build.py, uploaded as an
#     artifact: resolution needs python3 (this job runs on a bare
#     runner), execution needs only sh (the `build` job's container has
#     no python3, see docker/ci-toolchain/Dockerfile).
#   - build: matrices over discover's output, ONE JOB PER FAMILY (not per
#     module, not per MCU variant): the container image is pulled once
#     per job either way, so even one job per module (23 of them, an
#     earlier version of this workflow) paid for 23 redundant multi-GB
#     pulls to do a few seconds of real compiling each, and a fully
#     exploded per-MCU matrix (112 jobs before excluding known-broken
#     pairs) was worse still, badly bottlenecked by GitHub's
#     concurrent-job cap besides. Grouping by family cuts that to 2 pulls
#     while keeping PIC16/PIC18 builds running concurrently. Each job
#     loops over every module in its family and every MCU variant within
#     that module, keeps going past a failing module or variant instead of
#     stopping at the first one, and reports per-module-per-variant
#     PASS/FAIL in $GITHUB_STEP_SUMMARY, so a red job still tells you
#     exactly which module/variant broke without diving into raw logs.
#
# The GHCR package (pic8-hal-ci) is manually confirmed private (checked
# with `docker logout ghcr.io && docker pull`, returned "unauthorized").
# `gh api PATCH .../visibility` with GITHUB_TOKEN was tried first and did
# NOT work (the token lacks whatever scope that endpoint needs), despite
# the step exiting 0, so that attempt was removed rather than left in as
# false confidence. Visibility is a manual, one-time setting per package
# (its own Settings page, "Danger Zone"), not something this workflow
# re-asserts on every run.

on:
  push:
    branches: [master]
  pull_request:

# packages: read only, this workflow only ever pulls now (docs/
# docker-dev-plan.md); publishing the toolchain image is a local,
# human-triggered `make ci-image-push`, not something CI does anymore.
permissions:
  contents: read
  packages: read

jobs:
  # Pull-only (docs/docker-dev-plan.md): this workflow never builds or
  # pushes the toolchain image itself anymore. `make ci-image-push`
  # (root Makefile) is the only path that publishes a new tag; this job
  # fails loudly, with those exact instructions, if the tag it resolves
  # isn't on GHCR yet, the same "fail loudly, don't silently refetch from
  # somewhere" posture the old ci-assets jobs established for exactly
  # this reason (see this workflow's header comment).
  toolchain-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve version-pinned image tag
        run: |
          xc8_version="$(grep -m1 '^ARG XC8_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic16_dfp_version="$(grep -m1 '^ARG PIC16FXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic18_dfp_version="$(grep -m1 '^ARG PIC18FXXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic1216f1_dfp_version="$(grep -m1 '^ARG PIC12_16F1XXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          mplabx_version="$(grep -m1 '^ARG MPLABX_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          tag="xc8-v${xc8_version}-dfp${pic16_dfp_version}-${pic18_dfp_version}-${pic1216f1_dfp_version}-mplabx${mplabx_version}"
          image="ghcr.io/${{ github.repository_owner }}/pic8-hal-ci:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Resolved image: $image"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull the private toolchain image
        run: |
          image="${{ steps.resolve.outputs.image }}"
          if ! docker pull "$image"; then
            echo "error: no cached $image on GHCR." >&2
            echo "This workflow no longer builds the toolchain image itself" >&2
            echo "(see this workflow's header comment). To publish it:" >&2
            echo "  1. drop the Microchip installers in docker/ci-toolchain/vendor/" >&2
            echo "     (see \`make check-vendor\` for exact filenames)" >&2
            echo "  2. docker login ghcr.io -u <you> (needs a PAT with write:packages)" >&2
            echo "  3. make ci-image-push GHCR_OWNER=${{ github.repository_owner }}" >&2
            exit 1
          fi
          echo "Using cached $image"

  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      docs_only: ${{ steps.docs-only.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: discover
        run: |
          matrix="$(python3 scripts/epic_build.py matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Emit a build script for every matrix pair
        run: |
          xc8_version="$(grep -m1 '^ARG XC8_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          xc8_install_dir="/opt/microchip/xc8/v${xc8_version}"
          XC8_INSTALL_DIR="$xc8_install_dir" python3 - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, "scripts")
          import epicmanifest
          m = epicmanifest.load(epicmanifest.default_path())
          xc8_install_dir = os.environ["XC8_INSTALL_DIR"]
          for name in sorted(m.modules):
              mod = m.modules[name]
              for fam_name, mcus in sorted(mod.supported.items()):
                  fam = m.families[fam_name]
                  if m.example_for(name, fam_name) is None:
                      continue
                  dfp_dir = f"{xc8_install_dir}/pic/packs/{fam.dfp}/xc8"
                  for mcu in mcus:
                      subprocess.run(
                          ["python3", "scripts/epic_build.py", "build",
                           "--module", name, "--mcu", mcu,
                           "--build-dir", f"build/{name}",
                           "--dfp-dir", dfp_dir],
                          check=True, stdout=subprocess.DEVNULL,
                      )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: build-scripts
          path: build/
      # Docs-only PRs skip every real XC8 cross-compile in the `build`
      # job below: a prose change cannot affect whether a .hex links.
      # `toolchain-image` above stays unconditional on purpose (it's a
      # `docker pull` against an already-published tag, seconds against
      # GHCR's own cache, not worth a dependency edge just to skip it
      # too). Always "false" on a push to master, the full matrix always
      # runs there regardless of what changed.
      - id: docs-only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            result="$(bash scripts/ci-docs-only-check.sh '${{ github.event.pull_request.base.sha }}')"
          else
            result="false"
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

  build:
    needs: [toolchain-image, discover]
    if: needs.discover.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.toolchain-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-scripts
          path: build/
      - name: Build and verify every module/MCU in ${{ matrix.family }}
        # Explicit shell: bash, not this job's implicit default. A
        # `container:` job defaults to `sh`, unlike a bare `runs-on` job
        # which defaults to `bash`; this script uses `<<<` here-strings
        # and `read -ra` arrays, neither valid under `sh -e` ("Syntax
        # error: redirection unexpected", confirmed against a real failed
        # run before this fix, see the commit that added this comment).
        # The old per-module version never hit this: it only used a
        # POSIX `for mcu in $list` loop, no arrays.
        shell: bash
        # One job per family, not one per module or per (module, MCU):
        # with the image pulled once by the `container:` directive above,
        # looping over every module and every MCU variant here is what
        # actually saves the redundant multi-GB pulls a per-module matrix
        # (23 jobs) or a fully-exploded per-MCU matrix (112 jobs) would
        # pay for a few seconds of real compiling each. fail-fast is off
        # at the job level (above, though with only 2 jobs it barely
        # matters), and neither loop below stops at the first failure
        # either: a broken module doesn't hide results for the rest of
        # the family, and a broken MCU variant doesn't hide the rest of
        # that module's variants. The job still fails overall if anything
        # failed ($fail below), and $GITHUB_STEP_SUMMARY lists exactly
        # which module/MCU. matrix.modules is "name=mcu,mcu;name=mcu,..."
        # (see scripts/epic_build.py's `matrix` subcommand for why it's a
        # flat string and not nested JSON: no python3/jq in this
        # container). The DFP path is already baked into each emitted
        # script by the discover job (which has python3 and can read the
        # manifest), so this job never touches DFP_DIR itself.
        run: |
          fail=0
          {
            echo "| Module | MCU | Result |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          IFS=';' read -ra module_entries <<< "${{ matrix.modules }}"
          for entry in "${module_entries[@]}"; do
            name="${entry%%=*}"
            mcus="${entry#*=}"
            IFS=',' read -ra mcu_list <<< "$mcus"
            for mcu in "${mcu_list[@]}"; do
              echo "::group::${name} MCU=${mcu}"
              rm -f "build/${name}/${mcu}"/*.p1
              if EPIC_REPO_ROOT="$PWD" sh "build/${name}/${mcu}/build.sh" \
                 && [ "$(ls build/${name}/${mcu}-*.hex 2>/dev/null | wc -l)" -eq 1 ]; then
                echo "PASS: ${name} ${mcu}"
                echo "| ${name} | ${mcu} | PASS |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "FAIL: ${name} ${mcu}"
                echo "| ${name} | ${mcu} | FAIL |" >> "$GITHUB_STEP_SUMMARY"
                fail=1
              fi
              echo "::endgroup::"
            done
          done
          exit "$fail"
