name: xc8-build

# Phase 1 of docs/ci-plan.md: real-target XC8 builds, both families, every
# MCU variant, every module with an mcu/*-mplabx tree. No simulator yet
# (that's Phase 2+); this only proves every combination still produces a
# .hex.
#
# Four jobs:
#   - ci-assets: resolves a version-pinned tag for the vendor-installer
#     "blob carrier" image (docker/ci-assets/Dockerfile) and reuses it via
#     `docker pull` if it already exists on GHCR. On a cache miss, seeds it
#     from XC8_INSTALLER_BOOTSTRAP_URL (see that step's comment: this is a
#     one-time migration path, not meant to be a permanent fallback, and
#     should be deleted once docs/ci-plan.md confirms the private asset is
#     seeded). Attempts to set the package visibility to private, this is
#     the fix for a real problem: an earlier version of this pipeline
#     re-hosted the XC8 installer as a public GitHub Release asset, which
#     turned out to itself be redistribution (confirmed: `docker pull`
#     worked with zero auth), not authorized by Microchip's EULA (a *use*
#     license, not a redistribution one). See docs/ci-plan.md for the full
#     account.
#   - toolchain-image: needs ci-assets; extracts the installer from that
#     private image into docker/ci-toolchain/vendor/ (`docker create` +
#     `docker cp`, never `docker run`, there's nothing to run), then
#     resolves a version-pinned tag for the actual compiler image and
#     reuses it via `docker pull` if it already exists on GHCR, only
#     building+pushing on a cache miss.
#   - discover: finds every mcu/*-mplabx/Makefile from tracked files (no
#     hardcoded module list, same discipline as host-tests.yml's module
#     discovery) and pairs each with its family's MCU variants.
#   - build: matrices over discover's output, each leg building inside the
#     resolved image (guaranteed to exist on GHCR by the time this starts).

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  ci-assets:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve version-pinned asset image tag
        run: |
          xc8_version="$(grep -m1 '^ARG XC8_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          tag="xc8-v${xc8_version}-installer"
          image="ghcr.io/${{ github.repository_owner }}/pic8-hal-ci-assets:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Resolved asset image: $image"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull cached asset image, or seed it
        env:
          # One-time migration path: the very first version of this pipeline
          # re-hosted the installer here, publicly, before realizing that
          # was itself the problem this job exists to fix. Using it once
          # more, as the seed for the *private* replacement, is how that
          # public copy gets to stop existing. Not meant to survive past
          # that: a future XC8 version bump will make this URL point at the
          # wrong file, so the size check below only catches "empty/broken
          # download", not "wrong version". Delete this fallback (fail
          # instead, with instructions to reseed) once docs/ci-plan.md
          # records the migration as done.
          XC8_INSTALLER_BOOTSTRAP_URL: https://github.com/apojomovsky/pic8-hal/releases/download/ci-toolchain-assets/xc8-v4.00-full-install-linux-x64-installer.run
        run: |
          image="${{ steps.resolve.outputs.image }}"
          if docker pull "$image"; then
            echo "Reusing cached $image"
            exit 0
          fi

          echo "No cached $image, seeding it from $XC8_INSTALLER_BOOTSTRAP_URL"
          mkdir -p /tmp/asset-context
          curl -fsSL -o /tmp/asset-context/xc8-installer.run "$XC8_INSTALLER_BOOTSTRAP_URL"
          size=$(stat -c%s /tmp/asset-context/xc8-installer.run)
          if [ "$size" -lt 10000000 ]; then
            echo "error: downloaded installer is only ${size} bytes, expected a multi-megabyte file" >&2
            exit 1
          fi
          docker build -t "$image" -f docker/ci-assets/Dockerfile /tmp/asset-context
          docker push "$image"
      - name: Attempt to set package visibility to private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/pic8-hal-ci-assets/visibility" \
            -f visibility=private \
            && echo "Package visibility set to private" \
            || echo "::warning::Could not set pic8-hal-ci-assets visibility via API (GITHUB_TOKEN may lack the scope); verify manually in the package's Settings page."

  toolchain-image:
    needs: ci-assets
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Extract the installer from the private asset image
        run: |
          docker pull "${{ needs.ci-assets.outputs.image }}"
          docker create --name asset-extract "${{ needs.ci-assets.outputs.image }}"
          mkdir -p docker/ci-toolchain/vendor
          docker cp asset-extract:/xc8-installer.run docker/ci-toolchain/vendor/xc8-installer.run
          docker rm asset-extract
      - id: resolve
        name: Resolve version-pinned image tag
        run: |
          xc8_version="$(grep -m1 '^ARG XC8_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic16_dfp_version="$(grep -m1 '^ARG PIC16FXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          pic18_dfp_version="$(grep -m1 '^ARG PIC18FXXXX_DFP_VERSION=' docker/ci-toolchain/Dockerfile | cut -d= -f2)"
          tag="xc8-v${xc8_version}-dfp${pic16_dfp_version}-${pic18_dfp_version}"
          image="ghcr.io/${{ github.repository_owner }}/pic8-hal-ci:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Resolved image: $image"
      - name: Pull cached image, or build and push it
        run: |
          image="${{ steps.resolve.outputs.image }}"
          if docker pull "$image"; then
            echo "Reusing cached $image"
          else
            echo "No cached $image, building it"
            docker build -t "$image" docker/ci-toolchain
            docker push "$image"
          fi
      - name: Attempt to set package visibility to private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/pic8-hal-ci/visibility" \
            -f visibility=private \
            && echo "Package visibility set to private" \
            || echo "::warning::Could not set pic8-hal-ci visibility via API (GITHUB_TOKEN may lack the scope); verify manually in the package's Settings page."

  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: discover
        run: |
          matrix="$(python3 scripts/ci-discover-xc8-matrix.py)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Discovered $(echo "$matrix" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))') build legs"

  build:
    needs: [toolchain-image, discover]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.toolchain-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.dir }} MCU=${{ matrix.mcu }}
        # Neither DFP is bundled with the standalone XC8 v4.00 install (see
        # docker/ci-toolchain/Dockerfile), and each Makefile's own DFP_DIR
        # default still points at the repo's documented v3.10 path, so it
        # has to be overridden here to match where the image actually put
        # them ($XC8_INSTALL_DIR is set by the image itself).
        run: |
          case "${{ matrix.dir }}" in
            *pic16f87xa*) dfp=Microchip.PIC16Fxxx_DFP ;;
            *pic18fxx5x*) dfp=Microchip.PIC18Fxxxx_DFP ;;
            *) echo "unrecognized family for ${{ matrix.dir }}" >&2; exit 1 ;;
          esac
          make -C ${{ matrix.dir }} MCU=${{ matrix.mcu }} \
            DFP_DIR="${XC8_INSTALL_DIR}/pic/packs/${dfp}/xc8"
      - name: Confirm .hex was produced
        # Each module's TARGET has its own suffix (-firmware, -debounce,
        # -adcfilter-sizecheck, -multi-blink, ...), no single convention
        # to reconstruct, so glob instead of guessing a filename.
        run: |
          hex_count=$(ls ${{ matrix.dir }}/build/*.hex 2>/dev/null | wc -l)
          if [ "$hex_count" -ne 1 ]; then
            echo "expected exactly one .hex in ${{ matrix.dir }}/build, found $hex_count" >&2
            ls -la ${{ matrix.dir }}/build/ >&2 || true
            exit 1
          fi
