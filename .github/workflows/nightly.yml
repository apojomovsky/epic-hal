name: nightly

# Nightly (and manual) lightweight for every variant in the manifest.
# PR CI runs only the canonical per family (epic_build.py matrix with
# GITHUB_EVENT_NAME == pull_request); nightly proves no variant drifted
# while no PR touched it. Full per-variant build is variants x modules,
# but nightly runs it once (schedule), not on every PR.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  family-87xa:
    uses: ./.github/workflows/family-check.yml
    with:
      family: PIC16F87XA

  family-88x:
    uses: ./.github/workflows/family-check.yml
    with:
      family: PIC16F88X

  family-628a:
    uses: ./.github/workflows/family-check.yml
    with:
      family: PIC16F628A

  family-63x-67x-68x:
    uses: ./.github/workflows/family-check.yml
    with:
      family: PIC16F63x_67x_68x

  family-7x:
    uses: ./.github/workflows/family-check.yml
    with:
      family: PIC16F7x

  family-5x:
    uses: ./.github/workflows/family-check.yml
    with:
      family: PIC16F5x

  family-818_819:
    uses: ./.github/workflows/family-check.yml
    with:
      family: PIC16F818_819

  family-83_84:
    uses: ./.github/workflows/family-check.yml
    with:
      family: PIC16F83_84

  family-18fxx5x:
    uses: ./.github/workflows/family-check.yml
    with:
      family: PIC18Fxx5x

  family-1320:
    uses: ./.github/workflows/family-check.yml
    with:
      family: PIC18F1320

  family-2520:
    uses: ./.github/workflows/family-check.yml
    with:
      family: PIC18F2520

  family-6520:
    uses: ./.github/workflows/family-check.yml
    with:
      family: PIC18F6520

  family-193x:
    uses: ./.github/workflows/family-check.yml
    with:
      family: PIC16F193X
