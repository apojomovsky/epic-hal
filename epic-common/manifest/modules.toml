# HARNESS=sim for PIC16: the full golden-vector replay (same source
# as the real-target example and the PIC18 gate). The replay was
# blocked by an XC8 v4.00 layout constraint, measured 2026-08-09: the
# hand-asm routines' internal `goto`s carry no PCLATH management, so
# the linker must keep them in flash page 0; past ~2.5 K words it
# spilled them to page 1 and aborted with fixup-overflow 1356. The
# fix, applied 2026-08-11 (quality task 5a): every asm leaf is
