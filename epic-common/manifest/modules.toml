# firmware. Three scheduler tasks with distinct periods push distinct
# payloads through epic_serial_write every time they run; the ring is
# drained between scheduler rounds (the serial gate's GIE-managed
# drain pattern, see tests/combo_taskmgr_serial.c) and the cross-
# checks verify the run counts match the period ratios, every pushed
# byte was popped exactly once, the ring drained fully, and the tick
# counter advanced. PIC18Fxx5x (18F4550) only: the PIC16 Timer0-tick
# ISR path is unreliable under SIM (same reason as epic-taskmgr's own
