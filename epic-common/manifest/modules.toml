# HARNESS=sim (see scripts/ci-target-sim.sh): a bounded, self-reporting
# gate (tests/sim_lcd.c), distinct from the real-target hello example
# above (an unbounded demo with no core/epic_harness.h dependency).
# Runs the real compiled driver under MPLAB SIM through the real ops
# interface, verifying the exact HD44780 byte stream (init preamble,
# commands, data) and delay pattern the driver emits, plus the real
# transport init's pin configuration (TRISB via EPIC_BANK1_READ8 and
# the E/RS low state). The transport's send path cannot be driven
# through the ops function pointer under XC8 v4.00 on PIC16 (fptable
# ABI corrupts the callee's bank state and arguments; see the test
# file's finding), so the send calls are counted by a recorder rather
# than forwarded to the real gpio4_send. WDTE=OFF for the same reason
# as every other family's own sim variant: a diagnostic build that
# terminates and reports does not need the watchdog running
# unattended.
[modules.epic-lcd.example.PIC16F87XA.sim]
name        = "lcd-sim"
harness_src = "pic16f87xa-hal/src/mdb/pic16_harness_mdb.c"
sources     = [
  "tests/sim_lcd.c",
  "src/epic_lcd_gpio4.c",
]
config      = { BOREN = "ON", FOSC = "HS", LVP = "OFF", PWRTE = "ON", WDTE = "OFF", WRT = "OFF" }

