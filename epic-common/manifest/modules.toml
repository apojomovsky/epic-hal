# (SPEN + CREN + RCIE) with a line-framing echo callback, boot banner
# over TX, and a TX-free run loop (the polled-TX TSR-empty wait is an
# ISR-wedge landing zone, C4's finding). The echo path itself cannot
# fire under MPLAB SIM (no RX injection), so the line logic is verified
# on the host sim instead: this module is the first combo with a host
# CMake test, driving the same firmware through
# pic16f87xa_sim_drive_usart_rx (tests/test_rx_loopback.c).
[modules.epic-combo-rx-loopback.supported]
PIC16F87XA = [
  "16F877",
  "16F877A",
]

[modules.epic-combo-rx-loopback.example.PIC16F87XA]
name    = "rx_loopback"
sources = [
  "tests/combo_rx_loopback.c",
]
config  = { BOREN = "ON", FOSC = "HS", LVP = "OFF", PWRTE = "ON", WDTE = "OFF", WRT = "OFF" }

# HARNESS=sim, WDTE=OFF like every other sim variant.
