# read path (two EPIC_BANK1_READ8 windows plus the Bank-0 ADRESH read
# per EPIC_ADC_Read) competing with the polled-USART Bank-1 TXSTA
# reads. The combined peripherals are all pic16f87xa-hal drivers, so
# there are no separate module dependencies; needs_hal builds on the
# HAL like C1.
[modules.epic-combo-adc-uart.supported]
