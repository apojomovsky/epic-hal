# The epic-cc conformant slice (HAL-3): the subset that builds under
# epic-cc and fits the part's RAM (the full set exceeds the 877A's GPR
# capacity; the peripheral drivers hit filed isel gaps). Listed
# verbatim; later clusters grow the slice here. The family slice is the
# default: every module on the epic-cc path links the same set unless
# it declares its own `epiccc_hal_sources_by_family` override (verbatim
# replacement, validated against `hal_dir`/`epic-common`). See README
# `epiccc_hal_sources_by_family` section for when to use the per-module
# slice.
epiccc_sources = [
  "pic14-midrange-core/src/peripherals/pic14_gpio.c",
  "pic14-midrange-core/src/peripherals/pic14_timer0.c",
  "pic14-midrange-core/src/peripherals/pic14_timer2.c",
  "pic14-midrange-core/src/peripherals/pic14_ssp.c",
  "pic14-midrange-core/src/core/pic14_irq.c",
  "pic16f87xa-hal/src/core/pic16_irq_table.c",
  "pic14-midrange-core/src/core/pic14_wdt_sleep.c",
  "pic14-midrange-core/src/epiccc/pic14_wdt_sleep_epiccc.c",
  "pic14-midrange-core/src/epiccc/pic16_isr_vector.c",
  "pic14-midrange-core/src/epiccc/pic16_irq_dispatch_epiccc.c",
  "epic-common/src/core/epic_harness_target.c",
]

# The comparator and VREF drivers exist only on the A-parts: the non-A
# 873 die has no CMCON/CVRCON (DFP + gputils p16f873.inc agree).
[[families.PIC16F87XA.conditional_sources]]
path     = "pic14-midrange-core/src/peripherals/pic14_comp.c"
variants = ["16F873A", "16F874A", "16F876A", "16F877A", "16LF873A"]
[[families.PIC16F87XA.conditional_sources]]
path     = "pic14-midrange-core/src/peripherals/pic14_vref.c"
variants = ["16F873A", "16F874A", "16F876A", "16F877A", "16LF873A"]

# The MSSP driver exists only on parts with the SSP peripheral: the
# 870/871 cut-downs have no SSPCON/SSPSTAT/SSPADD (DFP headers).
[[families.PIC16F87XA.conditional_sources]]
path     = "pic14-midrange-core/src/peripherals/pic14_ssp.c"
variants = ["16F872", "16F873", "16F873A", "16F874", "16F874A", "16F876", "16F876A", "16F877", "16F877A", "16LF873A"]

# The USART driver exists on every part except the 872 cut-down,
# which has no TXSTA/RCSTA/SPBRG (DFP headers).
[[families.PIC16F87XA.conditional_sources]]
path     = "pic14-midrange-core/src/peripherals/pic14_usart.c"
variants = ["16F870", "16F871", "16F873", "16F873A", "16F874", "16F874A", "16F876", "16F876A", "16F877", "16F877A", "16LF873A"]

[[families.PIC16F87XA.conditional_sources]]
path     = "pic16f87xa-hal/src/peripherals/pic16f87xa_psp.c"
variants = [
  "16F871",
  "16F874",
  "16F874A",
  "16F877",
  "16F877A",
]

