# HARNESS=sim for PIC16: the minimal smoke16 (same source as the
# real-target example). The golden-value replay for PIC16 is blocked by
# an XC8 v4.00 layout constraint, measured 2026-08-09: the hand-asm
# routines' internal `goto`s carry no PCLATH management, so the linker
# must keep them in flash page 0; any build over ~2.5 K words (four
# checked structures tried: helper-function, single-function-inline,
# immediate-compare, and smoke16-shaped volatile parking) spills them
# to page 1 and aborts with fixup-overflow 1356. The gate still proves
# every asm body links and executes under the real toolchain without
# hanging; value correctness on PIC16 asm is carried by the PIC18 gate
# (full golden-vector replay) and the exhaustive host ctests. The
# recorded follow-up is pinning the PIC16 math routines below 0x800
# with __at(), the repo's established fix for this class.
[modules.epic-math.example.PIC16F87XA.sim]
name        = "math-selftest-sim"
harness_src = "pic16f87xa-hal/src/core/pic16_harness_sim_target.c"
sources     = [
  "tests/target_smoke16.c",
]
config      = { BOREN = "ON", FOSC = "HS", LVP = "OFF", PWRTE = "ON", WDTE = "OFF", WRT = "OFF" }

