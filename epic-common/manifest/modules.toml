# The eight PIC18 module Makefiles agree exactly on this order, which
# differs from pic18fxx5x-hal's own top-level Makefile (that one is a
# separate, unrelated build, not the one this migration replaces). SPP
# is only on the 40/44-pin parts; splice it in right after eeprom.c, its
# real position in every module Makefile's EPIC_SOURCES, not appended at
# the end: XC8 lays out psects in link order, so position is
# load-bearing for a byte-identical .hex, not just which files compile.
[[families.PIC18Fxx5x.conditional_sources]]
path     = "pic18fxx5x-hal/src/peripherals/pic18fxx5x_spp.c"
after    = "pic18fxx5x-hal/src/peripherals/pic18fxx5x_eeprom.c"
variants = [
  "18F4455",
  "18F4550",
]

# PIC16F193X has no higher-level modules yet (out of scope for the
# distribution work), so nothing else exercises its family HAL. This
