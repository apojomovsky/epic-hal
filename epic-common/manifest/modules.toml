# C8 of the combination matrix: the
# taskmgr scheduler and the epic-serial TX ring interleaved in one
# firmware. Three scheduler tasks with distinct periods push distinct
# payloads through epic_serial_write every time they run; the ring is
# drained between scheduler rounds (the serial gate's GIE-managed
# drain pattern, see tests/combo_taskmgr_serial.c) and the cross-
# checks verify the run counts match the period ratios, every pushed
# byte was popped exactly once, the ring drained fully, and the tick
# counter advanced. PIC18Fxx5x (18F4550) only: the PIC16 Timer0-tick
# ISR path is unreliable under SIM (same reason as epic-taskmgr's own
# sim gate).
[modules.epic-combo-taskmgr-serial.supported]
PIC18Fxx5x = [
  "18F4550",
]

[modules.epic-combo-taskmgr-serial.example.PIC18Fxx5x]
name    = "combo-taskmgr-serial"
sources = [
  "tests/combo_taskmgr_serial.c",
]
config  = { BOR = "OFF", BORV = "3", CCP2MX = "ON", CP0 = "OFF", CP1 = "OFF", CP2 = "OFF", CPB = "OFF", CPD = "OFF", CPUDIV = "OSC1_PLL2", DEBUG = "OFF", EBTR0 = "OFF", EBTR1 = "OFF", EBTR2 = "OFF", EBTRB = "OFF", FCMEN = "OFF", FOSC = "HS", IESO = "OFF", LPT1OSC = "OFF", LVP = "OFF", MCLRE = "ON", PBADEN = "OFF", PLLDIV = "5", PWRT = "ON", STVREN = "ON", USBDIV = "2", VREGEN = "OFF", WDT = "OFF", WDTPS = "32768", WRT0 = "OFF", WRT1 = "OFF", WRT2 = "OFF", WRTB = "OFF", WRTC = "OFF", WRTD = "OFF", XINST = "OFF" }

# HARNESS=sim, WDT=OFF like every other sim variant.
[modules.epic-combo-taskmgr-serial.example.PIC18Fxx5x.sim]
name        = "combo-taskmgr-serial-sim"
harness_src = "pic18fxx5x-hal/src/mdb/pic18_harness_mdb.c"
config      = { BOR = "OFF", BORV = "3", CCP2MX = "ON", CP0 = "OFF", CP1 = "OFF", CP2 = "OFF", CPB = "OFF", CPD = "OFF", CPUDIV = "OSC1_PLL2", DEBUG = "OFF", EBTR0 = "OFF", EBTR1 = "OFF", EBTR2 = "OFF", EBTRB = "OFF", FCMEN = "OFF", FOSC = "HS", IESO = "OFF", LPT1OSC = "OFF", LVP = "OFF", MCLRE = "ON", PBADEN = "OFF", PLLDIV = "5", PWRT = "ON", STVREN = "ON", USBDIV = "2", VREGEN = "OFF", WDT = "OFF", WDTPS = "32768", WRT0 = "OFF", WRT1 = "OFF", WRT2 = "OFF", WRTB = "OFF", WRTC = "OFF", WRTD = "OFF", XINST = "OFF" }

# The shared HAL library itself, manifest form (HAL-3): the harness
# implementation every family HAL links. The library is family-blind
# (it touches no SFR, no family include), so needs_hal is false; the
# example exercises the harness contract on every family and joins the
# XC8 CI matrix automatically. The example keeps the config WDTE=OFF:
# it has no WDT refresh of its own (the WDT driver is family HAL
# territory), so a watchdog would reset the run.
[modules.epic-common]
dir        = "epic-common"
sources    = [
  "src/core/epic_harness_target.c",
]
includes   = [
  "include",
]
depends_on = []
