sources    = []
includes   = []
depends_on = []
needs_hal  = true

# C2 of the combination matrix: TMR0 +
# TMR1 + TMR2 + USART, all interrupt-driven in one firmware. The gate
# hunts the three-way ISR interleave: the dispatch's per-source gating
# (TMR1's TMR1IE flag-gate, TXIF's TXIE gate) under load, GIE wedging
# (the Finding 10.1 class), and cross-timer corruption (a dropped
# TMR1 dispatch or a misdirected callback breaks the exact 2:1
# TMR1/TMR0 and the 65:1 TMR2/TMR0 count ratios). The combined
# peripherals are all pic16f87xa-hal drivers, so there are no separate
# module dependencies; needs_hal builds on the HAL like C1.
[modules.epic-combo-multitimer.supported]
PIC16F87XA = [
  "16F877A",
]

