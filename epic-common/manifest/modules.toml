# C5 of the combination matrix: EEPROM
# writes through the HAL's EECON2/EECON1 unlock sequence while a fast
# TIMER2 ISR runs throughout; completion is taken through the EEIF
# dispatch branch (EEIE armed, callback flag). The gate hunts
# preemption corruption of the unlock sequence and the EEIF dispatch
# under the live timer ISR. Hosted on the 18F4550 (not the 16F877A
# the matrix row was drafted for): MPLAB SIM's PIC16F87XA EEPROM
# model is inert (no write completion via CPU or debugger, RD strobe
# never refreshes EEDATA; verified 2026-08-09), while the runner's
# EEPROM_WRITES mechanism and the default EECON1/EECON2 addresses
# (0xFA6/0xFA7) are proven on PIC18 by the epic-settings gate. Run
# with EEPROM_WRITES=32 (the gate writes 8 bytes per main pass and
