# The epic-cc conformant slice (HAL-3g): the subset the combo
# integration firmwares need. The dispatch is the epiccc tier file
# (TIMER0 tick + USART + TIMER2 + EEPROM, same gating semantics as the
# full fan-out), because the shared pic18_irq_dispatch.c
# strong-references every peripheral handler and cannot link against a
# partial set. TIMER0 joined with its tick tier (epic-hal#236): the
# family hal_sources carry timer0.c, and epic-taskmgr's scheduler tick
# plus the blink example call EPIC_TIMER0_* directly. SSP joined
# for epic-sdcard (HAL-3d follow-up, epic-hal#102): the SD-over-SPI
# driver polls SSPBUF/SSPSTAT and never vectors SSPIF, so the tier
# dispatch is unchanged.
