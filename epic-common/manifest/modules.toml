sources = [
  "tests/example_blink.c",
]
config  = { FOSC = "INTOSC", WDTE = "ON", PWRTE = "ON", MCLRE = "ON", CP = "OFF", CPD = "OFF", BOREN = "ON", CLKOUTEN = "OFF", IESO = "OFF", FCMEN = "OFF", LVP = "OFF", STVREN = "ON", PLLEN = "OFF", WRT = "OFF" }

# HARNESS=sim (see sim-tests.yml, MODE=gpio): a bounded diagnostic
# build, distinct from the real-target example_blink.c above. Its
# default SIM_APP is tests/example_timer1.c (Timer1 is the family's
# Phase 0 load-bearing peripheral for this gate, see
# pic16f193x-hal/mcu/pic16f193x-mplabx/Makefile's own HARNESS=sim
# branch), which is why sources overrides the target example's rather
# than reusing it. WDTE=OFF for the same reason as every other family's
# sim variant: a diagnostic build that terminates and reports does not
# need the watchdog running unattended.
[modules.epic-pic16f193x-firmware.example.PIC16F193X.sim]
name        = "firmware-sim"
