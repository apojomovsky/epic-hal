name        = "rx_loopback-sim"
harness_src = "pic16f87xa-hal/src/mdb/pic16_harness_mdb.c"
config      = { BOREN = "ON", FOSC = "HS", LVP = "OFF", PWRTE = "ON", WDTE = "OFF", WRT = "OFF" }


# epic-cc slice (HAL-3g): the loopback runs on the USART alone, so the
# slice is epic-serial's serial tier with the mdb harness reporting.
[modules.epic-combo-rx-loopback.epiccc_hal_sources_by_family]
PIC16F87XA = [
  "pic14-midrange-core/src/peripherals/pic14_usart.c",
  "pic14-midrange-core/src/core/pic14_irq.c",
  "pic16f87xa-hal/src/core/pic16_irq_table.c",
