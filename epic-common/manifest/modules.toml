# forked from PIC18Fxx5x (same Access Bank / two-vector model,
# confirmed against p18f6520's device TOML in epic-cc). Largest of the
# three new families: 7 ports, 5 CCP, TMR4, dual EUSART, MSSP, PSP,
# 12-ch ADC, dual comparator, LVD, 1 KB EEPROM (DS39609B Table 1-1).
# No USB, no SPP. GPIO + Timer0-3 + CCP1-5 + MSSP + EUSART1/2 + IRQ
# backend; TMR4 has no driver yet (#183 covered Timer0-3 only).
# TMR4/LVD/PSP have no driver yet.
[families.PIC18F6520]
hal_dir  = "pic18f6520-hal"
# Canonical 18F6520 last so family-check's scaffold gate builds
# variants[-1] (as on the 2520 family); gen-sfr.py's CANONICAL entry
# for this family agrees.
variants = ["18F6620", "18F6720", "18F6585", "18F6520"]
dfp      = "Microchip.PIC18Fxxxx_DFP"
dfp_version = "1.7.171"
fosc_hz  = 20000000
# The 6520's config uses HS (external crystal, DS39609B §2.0) and
# carries no PLL/USB fields (no plldiv/cpudiv/usbdiv/vregen like the
# 2455 family), so there is no xtal/plldiv to check and no xtal_hz
# here; fosc_hz is the 20 MHz HS system clock the foundation examples
# assume (example_blink). The 6520's config-word register set uses the
# BOR / STVR field spellings (not BOREN / STVREN like the 2520;
# DS39609B §23.0) and has no MCLRE / IESO / FCMEN / PBADEN / XINST
# fields.
includes = [
  "pic18f6520-hal/include/target",
  "pic18f6520-hal/include",
  "epic-common/include",
]
# Baseline (every variant): GPIO + Timer0-3 + MSSP + ADC + comparator +
# EEPROM + the IRQ/WDT core, all present at the same addresses on every
# part in this family. CCP1-5, EUSART1/2 and the full dispatch are
# conditional_sources below: the ECAN parts (6585/6680/8585/8680) have
# only CCP1-2 and a single EUSART, so those drivers and the full
# dispatch's strong externs cannot link there.
hal_sources = [
  "pic18f6520-hal/src/peripherals/pic18f6520_gpio.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_timer0.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_timer1.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_timer2.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_timer3.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_ssp.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_adc.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_comp.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_eeprom.c",
  "pic18f6520-hal/src/core/pic18_irq.c",
  "pic18f6520-hal/src/target/pic18_isr_vector.c",
  "pic18f6520-hal/src/core/pic18f6520_wdt_sleep.c",
  "pic18f6520-hal/src/target/pic18f6520_wdt_sleep_target.c",
  "epic-common/src/core/epic_harness_target.c",
]
harness_src = "epic-common/src/core/epic_harness_target.c"

# The epic-cc conformant slice: GPIO + Timer0-3 + CCP/MSSP/EUSART +
# the IRQ/WDT core + the toolchain-specific vector/dispatch/WDT files.
# Grows by adding entries as peripherals land, never by editing the
# build driver.
epiccc_sources = [
  "pic18f6520-hal/src/peripherals/pic18f6520_gpio.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_timer0.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_timer1.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_timer2.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_timer3.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_ccp.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_ssp.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_usart.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_adc.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_comp.c",
  "pic18f6520-hal/src/peripherals/pic18f6520_eeprom.c",
  "pic18f6520-hal/src/core/pic18_irq.c",
  "pic18f6520-hal/src/core/pic18f6520_wdt_sleep.c",
  "pic18f6520-hal/src/epiccc/pic18f6520_wdt_sleep_epiccc.c",
  "pic18f6520-hal/src/epiccc/pic18_isr_vector.c",
  "pic18f6520-hal/src/epiccc/pic18_irq_dispatch_epiccc.c",
  "epic-common/src/core/epic_harness_target.c",
]

[[families.PIC18F6520.conditional_sources]]
path     = "pic18f6520-hal/src/peripherals/pic18f6520_ccp.c"
variants = ["18F6520", "18F6620", "18F6720"]
after    = "pic18f6520-hal/src/peripherals/pic18f6520_timer3.c"
[[families.PIC18F6520.conditional_sources]]
path     = "pic18f6520-hal/src/peripherals/pic18f6520_usart.c"
variants = ["18F6520", "18F6620", "18F6720"]
after    = "pic18f6520-hal/src/peripherals/pic18f6520_ssp.c"
[[families.PIC18F6520.conditional_sources]]
path     = "pic18f6520-hal/src/core/pic18_irq_dispatch.c"
variants = ["18F6520", "18F6620", "18F6720"]
after    = "pic18f6520-hal/src/core/pic18_irq.c"
[[families.PIC18F6520.conditional_sources]]
path     = "pic18f6520-hal/src/core/pic18_irq_dispatch_min.c"
variants = ["18F6585"]
after    = "pic18f6520-hal/src/core/pic18_irq.c"

