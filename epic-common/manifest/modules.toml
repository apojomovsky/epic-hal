# C12 of the combination matrix: epic-modbus
# + epic-serial + epic-tick on PIC18 (18F4550, modbus is PIC18-only).
# The gate (tests/combo_modbus_full.c) pushes an FC03 read-holding-
# registers request through the module's real TX path (epic_serial_write
# into the ring, drained by the real TX ISR into TXREG) while the 1 ms
# tick ISR is live: one byte per tick so every transmission is
# interleaved with real timer vectors, then the whole frame in one
# write (the modbus gate's exact push), and verifies the frame is
# byte-exact against the modbus gate's oracle (11 03 00 00 00 02 C6 9B)
# with the tick still advancing and GIE alive.
[modules.epic-combo-modbus-full]
dir        = "tests/epic-combo-modbus-full"
sources    = []
includes   = []
depends_on = [
  "epic-modbus",
  "epic-serial",
  "epic-tick",
]
needs_hal  = true

[modules.epic-combo-modbus-full.supported]
PIC18Fxx5x = [
  "18F4550",
]

