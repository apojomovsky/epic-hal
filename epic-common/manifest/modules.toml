# The epic-cc conformant slice, riding the landed p16f54 epic-cc
# target (epic-cc#413). Measured 2026-09-17 under the corrected p16f54
# geometry (epic-cc#437): the pre-#437 sizing no longer links (demand
# exceeds the 18-byte banked span) and the GPIO driver is flash-bound
# here (driver + minimal toggle = 557 of 512 words), so the XC8 legs
# plus the mdb gate carry the HAL verification; the epic-cc build
# drives the registers directly.
